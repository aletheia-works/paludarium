name: Guest toolchain
description: >-
  Installs packages from apt, with a C toolchain for the x86-64 baseline.
  Guests are compared on an emulator without AVX, but Ubuntu's public cloud
  images from 26.04 on take amd64v3 packages: gcc then defaults to
  -march=x86-64-v3, and musl's libc.a and glibc are built for it too.
  The packages and apt's lists are kept in the Actions cache for each runner
  image, so a job whose image has been seen before installs without the
  network.

inputs:
  packages:
    description: The apt packages to install, separated by spaces
    required: true

runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        ACTION: ${{ github.action_path }}/action.yml
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        # A new runner image may install other versions, and reinstalling the toolchain from
        # an older image's files would downgrade it, so each image gets its own entry.
        digest="$( (echo "$PACKAGES"; cat "$ACTION") | sha256sum | cut -c1-16)"
        echo "key=guest-toolchain-${ImageOS:-}-${ImageVersion:-}-$RUNNER_ARCH-$digest" >> "$GITHUB_OUTPUT"
        echo "dir=$RUNNER_TEMP/guest-toolchain-apt" >> "$GITHUB_OUTPUT"
        # Every branch reads what the default branch saved, but what a pull request saves only
        # that pull request reads, and each would take room the Rust caches need.
        if [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
          echo "save=true" >> "$GITHUB_OUTPUT"
        fi

    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}

    - id: install
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_SUSPEND: "1"
        CACHED: ${{ steps.restore.outputs.cache-hit }}
        SAVE: ${{ steps.restore.outputs.cache-hit != 'true' && steps.key.outputs.save == 'true' }}
        CACHE_DIR: ${{ steps.key.outputs.dir }}
      run: |
        shopt -s nullglob
        mirrors=/etc/apt/apt-mirrors.txt
        archives=/var/cache/apt/archives
        lists=/var/lib/apt/lists
        # From the cache, apt finds every file it needs on disk: it neither updates its lists
        # nor downloads. If something is missing anyway, it stops before installing anything,
        # and the job takes the network as if nothing was cached.
        offline=
        if [ "$CACHED" = true ]; then
          debs=("$CACHE_DIR"/archives/*.deb)
          if [ "${#debs[@]}" -gt 0 ]; then
            sudo cp "${debs[@]}" "$archives"/
          fi
          sudo rm -rf "$lists"
          sudo cp -r "$CACHE_DIR/lists" "$lists"
          sudo chown -R root:root "$lists"
          offline=1
        fi
        # All the mirrors a runner lists are under ubuntu.com, and the runners' DNS has failed
        # for that domain alone while it resolved others (2026-11-11). apt tries the mirrors in
        # order of priority, so mirrors under other domains come last.
        if [ -f "$mirrors" ]; then
          for mirror in https://mirrors.edge.kernel.org/ubuntu/ https://mirror.math.princeton.edu/pub/ubuntu/; do
            if ! grep -qF "$mirror" "$mirrors"; then
              printf '%s\tpriority:9\n' "$mirror" | sudo tee -a "$mirrors" > /dev/null
            fi
          done
        fi
        # One update serves the whole job, so the files the toolchain and the packages were
        # downloaded with all come from the lists the cache keeps.
        updated=
        # An update has hung on a mirror until the job's 60 minutes ran out (2026-11-11), so
        # each attempt is bounded. apt-get update exits 0 when a source is unreachable, so an
        # attempt also fails when a package has no candidate in the lists it left. This looks
        # only at the lists, not at dependencies or what is installed; a misspelled package
        # fails it too and costs the three attempts. A later attempt goes without the Azure
        # mirror when others are listed. Without lists nothing installs, so the last failure
        # fails the job.
        candidates() {
          local package policy
          # shellcheck disable=SC2086 # the packages are separate words
          for package in $PACKAGES; do
            # Not piped into grep -q, whose early exit could make apt-cache fail under pipefail.
            policy="$(apt-cache policy "$package")"
            if ! grep -q '^  Candidate: [^(]' <<< "$policy"; then
              echo "apt's lists have no candidate for $package" >&2
              return 1
            fi
          done
        }
        refresh() {
          local attempt
          for attempt in 1 2 3; do
            if sudo timeout --kill-after=10 120 apt-get update && candidates; then
              return 0
            fi
            echo "apt-get update failed, hit its limit of 120 seconds or left no candidate (attempt $attempt of 3)" >&2
            if [ "$attempt" -eq 3 ]; then
              return 1
            fi
            if [ -f "$mirrors" ] && grep -q 'azure\.archive\.ubuntu\.com' "$mirrors" &&
              grep -qv 'azure\.archive\.ubuntu\.com' "$mirrors"; then
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$mirrors"
            fi
            sleep 15
          done
        }
        update() {
          if [ -z "$offline" ] && [ -z "$updated" ]; then
            refresh
            updated=1
          fi
        }
        # The Azure mirror sometimes serves one job at 40 kB/s while another job of the same run
        # gets 45 MB/s from it, and apt stays on it until the job times out. So bound the download
        # (not the install: stopping dpkg would leave packages half installed) and fall back to
        # the other mirrors. Each attempt goes on from the files the previous one left, and all
        # downloads share one deadline, which leaves line coverage the time it needs.
        deadline=$((SECONDS + 720))
        download() {
          local limit
          # apt exits 100 for a misspelled package and for a failed fetch alike. This needs no
          # network, so what no retry can fix fails here at once.
          apt-get install --simulate --no-install-recommends "$@" > /dev/null || return
          if [ -n "$offline" ]; then
            if sudo apt-get install -y --no-install-recommends --download-only --no-download "$@"; then
              return 0
            fi
            echo "::warning::the cached apt files for this image are not enough; using the network"
            offline=
            refresh || return
            updated=1
          fi
          while true; do
            limit=$((deadline - SECONDS))
            if [ "$limit" -le 0 ]; then
              echo "apt downloads did not finish within 12 minutes" >&2
              return 1
            fi
            if [ "$limit" -gt 180 ]; then
              limit=180
            fi
            if sudo timeout --kill-after=10 "$limit" \
              apt-get install -y --no-install-recommends --download-only "$@"; then
              return 0
            fi
            echo "apt download failed or hit its limit of $limit seconds" >&2
            if [ -f "$mirrors" ] && grep -q 'azure\.archive\.ubuntu\.com' "$mirrors" &&
              grep -qv 'azure\.archive\.ubuntu\.com' "$mirrors"; then
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$mirrors"
              # The lists came from the mirror just dropped, and the others may differ from it.
              sudo timeout --kill-after=10 120 apt-get update || echo "apt-get update failed" >&2
            fi
            sleep 15
          done
        }
        variant=/etc/apt/apt.conf.d/90arch-variant
        toolchain=()
        if [ -f "$variant" ]; then
          sudo rm -f "$variant"
          update
          version="$(gcc -dumpversion)"
          toolchain=(
            --reinstall --allow-downgrades
            libc-bin libc6 libc6-dev libgcc-s1 "libgcc-$version-dev" "libstdc++-$version-dev"
            "cpp-$version" "cpp-$version-x86-64-linux-gnu"
            "gcc-$version" "gcc-$version-x86-64-linux-gnu"
            "g++-$version" "g++-$version-x86-64-linux-gnu"
          )
          download "${toolchain[@]}"
          sudo -E apt-get install -y --no-install-recommends "${toolchain[@]}"
        fi
        update
        # What apt fetches for the packages: those the image already has are not among them.
        # shellcheck disable=SC2086 # the packages are separate words
        mapfile -t fetched < <(apt-get install --simulate --no-install-recommends $PACKAGES |
          awk '/^Inst /{print $2}')
        # shellcheck disable=SC2086 # the packages are separate words
        download $PACKAGES
        # shellcheck disable=SC2086 # the packages are separate words
        sudo -E apt-get install -y --no-install-recommends $PACKAGES
        if gcc -dM -E - < /dev/null | grep -q __AVX__; then
          echo "gcc still targets AVX: $(gcc -Q --help=target | grep -E '^ +-march=' | head -1)" >&2
          exit 1
        fi
        # What a guest links has to be free of it too.
        if command -v musl-gcc > /dev/null; then
          scratch="$(mktemp -d)"
          echo 'int main(void) { return 0; }' > "$scratch/guest.c"
          musl-gcc -static -O2 -o "$scratch/guest" "$scratch/guest.c"
          if objdump -d "$scratch/guest" | grep -qE '[[:space:]]v[a-z0-9]+[[:space:]]+.*%[xy]mm'; then
            echo "a musl program still holds AVX instructions" >&2
            exit 1
          fi
          rm -rf "$scratch"
        fi
        # Keep what this job used for the next job on the same image. A cache entry cannot be
        # replaced, so one that misses a file would cost every later job on the image a failed
        # attempt; keep only what installs again from disk. A mirror dropped above updates the
        # lists a second time, and that can leave the earlier files behind them.
        # Installed now, the toolchain and what the packages fetched are reinstalled to check
        # that their files are all there.
        check=("${toolchain[@]:2}" "${fetched[@]}")
        if [ "$SAVE" = true ] && [ "${#check[@]}" -gt 0 ] &&
          ! sudo apt-get install -y --no-install-recommends \
            --download-only --no-download --reinstall --allow-downgrades "${check[@]}" > /dev/null; then
          echo "::warning::the downloaded apt files no longer match the lists; not caching them"
          SAVE=
        fi
        if [ "$SAVE" = true ]; then
          mkdir -p "$CACHE_DIR/archives"
          debs=("$archives"/*.deb)
          if [ "${#debs[@]}" -gt 0 ]; then
            cp "${debs[@]}" "$CACHE_DIR/archives/"
          fi
          sudo cp -r "$lists" "$CACHE_DIR/lists"
          sudo rm -rf "$CACHE_DIR/lists/partial" "$CACHE_DIR/lists/lock"
          sudo chown -R "$(id -u):$(id -g)" "$CACHE_DIR"
          echo "save=true" >> "$GITHUB_OUTPUT"
        fi

    - if: steps.install.outputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
