version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/fuzz"
      # The probe guest; aube and the nightly Rust move with bump-pins.yml.
      - "/tests/guests/programs/probe"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/spikes/wasm-threads"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore(deps)"
    groups:
      wasm-threads:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: "bun"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore(docs)"
    groups:
      docs:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: "terraform"
    directory: "/infra/github"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore(infra)"
    groups:
      terraform-providers:
        patterns:
          - "*"
    open-pull-requests-limit: 5
