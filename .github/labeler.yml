ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
"scope: infra":
  - changed-files:
      - any-glob-to-any-file:
          - "infra/**"
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "Cargo.lock"
          - "fuzz/Cargo.lock"
          - "**/package.json"
          - "**/package-lock.json"
emulator:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/**"
          - "fuzz/fuzz_targets/**"
wasm:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/paludarium-wasm/**"
          - "crates/paludarium-jit/**"
          - "packages/**"
tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
          - "crates/paludarium-harness/**"
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - "docs/**"
tooling:
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/**"
          - "mise-tasks/**"
          - "mise.toml"
          - "ruff.toml"
          - "tombi.toml"
          - ".rumdl.toml"
          - "rust-toolchain.toml"
          - "deny.toml"
          - "clippy.toml"
