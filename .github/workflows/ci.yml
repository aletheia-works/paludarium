# Pull-request gate: unit tests on Linux, macOS and Windows, fmt, clippy
# (-D warnings), dependency checks, the x86-64 Linux differential tests and
# the 80% line-coverage floor. A pull request runs the jobs its changed
# files need (scripts/ci-changes.py) and a push to main runs every job;
# ci-ok, the required check, passes only when every job passed or was not
# needed. Actions are pinned by commit SHA and the default token is
# read-only.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PALUDARIUM_TEST_NODE: node
  # The core crates.
  CORE_PACKAGES: >-
    -p paludarium-types -p paludarium-decoder -p paludarium-mmu
    -p paludarium-cpu -p paludarium-loader -p paludarium-vfs
    -p paludarium-kernel -p paludarium-host -p paludarium-jit
    -p paludarium-runtime -p paludarium

jobs:
  # Which job groups this pull request's changed files need
  # (scripts/ci-changes.py); a push to main runs every job.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.groups.outputs.rust }}
      dependencies: ${{ steps.groups.outputs.dependencies }}
      fuzz: ${{ steps.groups.outputs.fuzz }}
      wasm: ${{ steps.groups.outputs.wasm }}
      programs: ${{ steps.groups.outputs.programs }}
      production_wasm: ${{ steps.groups.outputs.production_wasm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/ci-changes.py --self-test
      - id: groups
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            python3 scripts/ci-changes.py --all
          else
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
              --jq '.[] | .filename, (.previous_filename // empty)' |
              python3 scripts/ci-changes.py
          fi

  wasm-programs:
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    uses: ./.github/workflows/wasm-programs.yml
  fuzz:
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    uses: ./.github/workflows/fuzz-pr.yml
  programs:
    name: fixed guest programs
    needs: changes
    if: needs.changes.outputs.programs == 'true'
    uses: ./.github/workflows/programs.yml

  production-wasm:
    name: production wasm (shared Rust heap, nested Workers)
    needs: changes
    if: needs.changes.outputs.production_wasm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.11.1'
      - uses: ./.github/actions/rust-toolchain
        with:
          args: component add rust-src --toolchain nightly-2026-10-11
      - name: Generate and execute fresh native fixtures
        run: |
          mkdir -p target/production-wasm-evidence
          python3 packages/paludarium-wasm/tests/generate-guests.py --check
          python3 scripts/wasm-native-guests.py > target/production-wasm-evidence/native-results.json
      - name: Build actual production Session module
        run: bash mise-tasks/wasm/build.sh
      - name: Compare production wasm with native results
        run: |
          node --test packages/paludarium-wasm/tests/import-check.mjs
          node packages/paludarium-wasm/tests/node-check.mjs packages/paludarium-wasm/paludarium.wasm target/production-wasm-evidence/native-results.json > target/production-wasm-evidence/node-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: production-wasm-evidence
          path: |
            target/production-wasm-evidence/
            packages/paludarium-wasm/paludarium.wasm
          retention-days: 7
  test:
    name: unit tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        # Retried: static.rust-lang.org downloads sometimes fail on CI.
        uses: ./.github/actions/rust-toolchain
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Unit tests (core crates)
        shell: bash
        run: |
          read -r -a packages <<< "$CORE_PACKAGES"
          cargo test --locked "${packages[@]}" -- --nocapture
        env:
          RUST_BACKTRACE: "1"
      - name: Harness unit tests
        run: cargo test --locked -p paludarium-harness --lib

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        # Retried: static.rust-lang.org downloads sometimes fail on CI.
        uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: rustup retry script tests
        shell: bash
        run: bash scripts/rustup-retry.test.sh
      - name: rustfmt
        run: |
          cargo fmt --all --check
          cargo fmt --check --manifest-path fuzz/Cargo.toml
          cargo fmt --check --manifest-path tests/guests/hello-rs/Cargo.toml
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: decoder builds for wasm32
        run: cargo build --locked -p paludarium-decoder -p paludarium-mmu -p paludarium-cpu --target wasm32-unknown-unknown

  dependencies:
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        # Retried: static.rust-lang.org downloads sometimes fail on CI.
        uses: ./.github/actions/rust-toolchain
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: cargo-deny
          cache: false
      # Licenses compatible with Apache-2.0, crates.io only, RustSec,
      # forbidden crates.
      - run: cargo deny --locked check

  differential:
    name: differential tests (x86-64 Linux)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Restore before anything is written to target/: on a partial cache
      # match rust-cache cleans target/ first.
      - name: Install the pinned Rust toolchain
        # Retried: static.rust-lang.org downloads sometimes fail on CI.
        uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Record native architectural profile
        run: |
          mkdir -p target/encodings-guests
          uname -a > target/encodings-guests/uname.txt
          lscpu > target/encodings-guests/cpu.txt
      # Builds the guests from source, runs each natively and under the
      # emulator, compares stdout/stderr/exit status and prints the run times.
      - run: cargo test --locked -p paludarium-harness --test diff_core --test diff_instructions --test parallel_instructions --test diff_signals_time --test diff_terminal --test diff_encodings --test diff_processes -- --nocapture
      - name: Retain fresh encodings architectural observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: encodings-differential-observations
          path: target/encodings-guests/
          retention-days: 7

  coverage:
    name: line coverage >= 80%
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PALUDARIUM_ENCODINGS_FULL_REPLAY: '1'
      PALUDARIUM_ENCODINGS_NATIVE_OBSERVATIONS: ${{ github.workspace }}/target/encodings-guests/observe.native
      PALUDARIUM_ENCODINGS_NATIVE_FAULTS: ${{ github.workspace }}/target/encodings-guests/fault-observe.native
      PALUDARIUM_ENCODINGS_NATIVE_CPUID: ${{ github.workspace }}/target/encodings-guests/cpuid-observe.native
      PALUDARIUM_THREADS_EMULATOR: ${{ github.workspace }}/target/llvm-cov-target/debug/paludarium
      PALUDARIUM_EVENTS_EMULATOR: ${{ github.workspace }}/target/llvm-cov-target/debug/paludarium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Restore before anything is written to target/: on a partial cache
      # match rust-cache cleans target/ first.
      - name: Install the pinned Rust toolchain
        # Retried: static.rust-lang.org downloads sometimes fail on CI.
        uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Record native architectural profile
        run: |
          mkdir -p target/encodings-guests
          uname -a > target/encodings-guests/uname.txt
          lscpu > target/encodings-guests/cpu.txt
      - name: Generate fresh encodings native inputs before instrumented library tests
        shell: bash
        run: |
          bash tests/guests/encodings/build.sh target/encodings-guests
          python3 - <<'PY_NATIVE'
          from pathlib import Path
          import subprocess, os, signal, json, hashlib
          out=Path('target/encodings-guests')
          rows=[]
          for name, expected_rows in [('observe',23576),('fault-observe',1162),('cpuid-observe',12)]:
              binary=out/name
              with (out/(name+'.native')).open('wb') as stdout, (out/(name+'.stderr')).open('wb') as stderr:
                  child=subprocess.Popen([str(binary.resolve())], stdout=stdout, stderr=stderr, start_new_session=True)
                  try:
                      code=child.wait(timeout=30)
                  except subprocess.TimeoutExpired:
                      os.killpg(child.pid,signal.SIGKILL)
                      child.wait()
                      raise
              data=(out/(name+'.native')).read_bytes()
              rows.append({'name':name,'exit':code,'rows':len(data.splitlines()),'binary_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),'output_sha256':hashlib.sha256(data).hexdigest()})
              (out/'native-input-receipt.json').write_text(json.dumps(rows,indent=2)+'\n')
              assert code==0 and len(data.splitlines())==expected_rows and not (out/(name+'.stderr')).read_bytes()
          PY_NATIVE
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: aqua:taiki-e/cargo-llvm-cov
          cache: false
      # Fails below 80% of lines. The floor is never lowered.
      - name: Workspace line coverage >= 80%
        run: |
          cargo llvm-cov clean --workspace
          (
            # shellcheck disable=SC1090
            source <(cargo llvm-cov show-env --sh)
            cargo build --locked -p paludarium --target-dir target/llvm-cov-target
          )
          cargo llvm-cov --no-clean --locked --workspace --fail-under-lines 80
        env:
          # Instrumented independent cases run serially; race cases still
          # launch their own host workers and retain the 30-second watchdog.
          RUST_TEST_THREADS: "1"
      - name: Wasm changed Rust components line coverage >= 80%
        run: |
          cargo llvm-cov --locked -p paludarium-host -p paludarium-vfs -p paludarium-kernel -p paludarium-runtime -p paludarium-wasm --lib --ignore-filename-regex 'paludarium-(cpu|decoder|mmu|loader|types|jit)/' --fail-under-lines 80 --lcov --output-path target/wasm-coverage.lcov
      - name: Retain wasm coverage observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wasm-coverage-lcov
          path: target/wasm-coverage.lcov
      - name: Core package line coverage >= 80%
        # Keep the same core production file set; fresh architectural tests live
        # in Harness and must execute when measuring the newly shared CPU code.
        run: |
          cargo llvm-cov clean --workspace
          (
            # shellcheck disable=SC1090
            source <(cargo llvm-cov show-env --sh)
            cargo build --locked -p paludarium --target-dir target/llvm-cov-target
          )
          read -r -a packages <<< "$CORE_PACKAGES"
          cargo llvm-cov --no-clean --locked "${packages[@]}" -p paludarium-harness --ignore-filename-regex 'paludarium-harness/' --fail-under-lines 80
        env:
          RUST_TEST_THREADS: "1"

      - name: Terminal target crates line coverage >= 80%
        run: |
          cargo llvm-cov --locked -p paludarium-host -p paludarium-kernel -p paludarium-runtime -p paludarium -p paludarium-harness --lib --test diff_terminal --test command --ignore-filename-regex 'paludarium-(cpu|decoder|mmu|loader|types|vfs|jit|harness)/' --fail-under-lines 80 --lcov --output-path target/terminal-coverage.lcov
          cargo llvm-cov report --ignore-filename-regex 'paludarium-(cpu|decoder|mmu|loader|types|vfs|jit|harness)/'
        env:
          RUST_TEST_THREADS: "1"
      - name: Encodings CPU and Decoder line coverage >= 80%
        run: |
          cargo llvm-cov --locked -p paludarium-cpu -p paludarium-decoder -p paludarium-harness --lib --test diff_encodings --ignore-filename-regex 'paludarium-(types|mmu|host|kernel|loader|vfs|jit|runtime|harness)/' --fail-under-lines 80 --lcov --output-path target/encodings-coverage.lcov
          cargo llvm-cov report --ignore-filename-regex 'paludarium-(types|mmu|host|kernel|loader|vfs|jit|runtime|harness)/'
        env:
          RUST_TEST_THREADS: "1"
      - name: Retain encodings coverage observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: encodings-coverage-lcov
          path: target/encodings-coverage.lcov
          retention-days: 7
      - name: Retain native states even when coverage fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: encodings-coverage-native-observations
          path: target/encodings-guests/
          retention-days: 7
      - name: Retain terminal coverage line observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: terminal-coverage-lcov
          path: target/terminal-coverage.lcov
          retention-days: 7

  # The one required check: every job above passed or was not needed.
  ci-ok:
    if: always()
    needs: [changes, wasm-programs, fuzz, programs, production-wasm, test, lint, dependencies, differential, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
