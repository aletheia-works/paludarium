# Pull-request gate: unit tests on Linux, macOS and Windows, fmt, clippy
# (-D warnings, also with the stable Rust of rust-version), dependency
# checks, the x86-64 Linux differential tests and the 80% line-coverage
# floor. A pull request runs the jobs its changed
# files need (scripts/ci-changes.py) and a push to main runs every job but
# the pull-request checks of other workflows (polyglot lint, the docs build
# and the release check). The expensive jobs (differential tests, coverage,
# fuzzing, the guest programs and the WebAssembly checks) start only after
# the quick stage (lint, clippy, polyglot lint and the Linux unit tests)
# passed. ci-ok, the required check, passes only when every job passed or
# was not needed.
# Actions are pinned by commit SHA and the default token is read-only.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PALUDARIUM_TEST_NODE: node
  # The core crates.
  CORE_PACKAGES: >-
    -p paludarium-types -p paludarium-decoder -p paludarium-mmu
    -p paludarium-cpu -p paludarium-loader -p paludarium-vfs
    -p paludarium-kernel -p paludarium-host -p paludarium-jit
    -p paludarium-jit-native
    -p paludarium-runtime -p paludarium

jobs:
  # Which job groups this pull request's changed files need
  # (scripts/ci-changes.py); a push to main needs every group, so it runs
  # every job but the pull-request checks of other workflows.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.groups.outputs.rust }}
      unit: ${{ steps.groups.outputs.unit }}
      dependencies: ${{ steps.groups.outputs.dependencies }}
      fuzz: ${{ steps.groups.outputs.fuzz }}
      wasm: ${{ steps.groups.outputs.wasm }}
      safari: ${{ steps.groups.outputs.safari }}
      programs: ${{ steps.groups.outputs.programs }}
      production_wasm: ${{ steps.groups.outputs.production_wasm }}
      docs: ${{ steps.groups.outputs.docs }}
      release_check: ${{ steps.groups.outputs.release_check }}
      fuzz_targets: ${{ steps.groups.outputs.fuzz_targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The fuzz selection reads cargo metadata; the runner's stable cargo
      # does that without installing the pinned nightly.
      - run: python3 scripts/ci-changes.py --self-test
        env:
          RUSTUP_TOOLCHAIN: stable
      # rerun-unacquired.yml's decision, from main, after each CI run.
      - run: python3 -B scripts/ci-rerun.py --self-test
      - id: groups
        env:
          RUSTUP_TOOLCHAIN: stable
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            python3 scripts/ci-changes.py --all
          else
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
              --jq '.[] | .filename, (.previous_filename // empty)' |
              python3 scripts/ci-changes.py
          fi

  wasm-programs:
    needs: [changes, quick]
    if: ${{ !cancelled() && needs.quick.result == 'success' && needs.changes.outputs.wasm == 'true' }}
    uses: ./.github/workflows/wasm-programs.yml
    # Safari's row runs on a macOS runner, which may be scarce; it is left out
    # when the changes reach only crates the Wasm module does not link.
    with:
      safari: ${{ needs.changes.outputs.safari == 'true' }}
  # Only the targets the changes can affect. None chosen skips the job; a
  # failed choice fails changes, and so ci-ok.
  fuzz:
    needs: [changes, quick]
    if: ${{ !cancelled() && needs.quick.result == 'success' && needs.changes.outputs.fuzz == 'true' && needs.changes.outputs.fuzz_targets != '[]' }}
    uses: ./.github/workflows/fuzz-pr.yml
    with:
      targets: ${{ needs.changes.outputs.fuzz_targets }}
  # Every fuzz bin still compiles whenever the fuzz group is needed, also
  # when the change reaches none of the targets fuzz runs (the JIT targets
  # are only fuzzed nightly).
  fuzz-build:
    name: fuzz targets build
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        # Retried: static.rust-lang.org downloads sometimes fail on CI.
        uses: ./.github/actions/rust-toolchain
      - run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins
  programs:
    name: fixed guest programs
    needs: [changes, quick]
    if: ${{ !cancelled() && needs.quick.result == 'success' && needs.changes.outputs.programs == 'true' }}
    uses: ./.github/workflows/programs.yml
  # The pull-request checks of other workflows, so that ci-ok waits for them.
  polyglot-lint:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/test-lint-check.yml
  docs:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs-build.yml
  release-check:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.release_check == 'true'
    uses: ./.github/workflows/release-check.yml

  production-wasm:
    name: production wasm (shared Rust heap, nested Workers)
    needs: [changes, quick]
    if: ${{ !cancelled() && needs.quick.result == 'success' && needs.changes.outputs.production_wasm == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 'latest'
      - uses: ./.github/actions/rust-toolchain
        with:
          args: component add rust-src --toolchain $RUST_TOOLCHAIN
      - name: Generate and execute fresh native fixtures
        run: |
          mkdir -p target/production-wasm-evidence
          python3 packages/paludarium-wasm/tests/generate-guests.py --check
          python3 scripts/wasm-native-guests.py > target/production-wasm-evidence/native-results.json
      - name: Build actual production Session module
        run: bash mise-tasks/wasm/build.sh
      - name: Compare production wasm with native results
        run: |
          node --test packages/paludarium-wasm/tests/import-check.mjs packages/paludarium-wasm/tests/stdin-poll.test.mjs packages/paludarium-wasm/tests/wasm-heap-reserve.test.mjs packages/paludarium-wasm/tests/wasm-network.test.mjs packages/paludarium-wasm/tests/wasm-relay.test.mjs
          node packages/paludarium-wasm/tests/node-check.mjs packages/paludarium-wasm/paludarium.wasm target/production-wasm-evidence/native-results.json > target/production-wasm-evidence/node-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: production-wasm-evidence
          path: |
            target/production-wasm-evidence/
            packages/paludarium-wasm/paludarium.wasm
          retention-days: 7
  # The Linux unit tests are part of the quick stage; macOS and Windows run
  # beside it. The two jobs run the same steps.
  test-linux:
    name: unit tests (ubuntu-latest)
    needs: changes
    # The crates these tests build and the files outside them their sources
    # name (scripts/ci-changes.py's unit group).
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps: &unit-test-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        # Retried: static.rust-lang.org downloads sometimes fail on CI.
        uses: ./.github/actions/rust-toolchain
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Unit tests (core crates)
        shell: bash
        run: |
          read -r -a packages <<< "$CORE_PACKAGES"
          cargo test --locked "${packages[@]}" -- --nocapture
        env:
          RUST_BACKTRACE: "1"
      - name: Harness unit tests
        run: cargo test --locked -p paludarium-harness --lib

  test:
    name: unit tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps: *unit-test-steps

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        # Retried: static.rust-lang.org downloads sometimes fail on CI.
        uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: rustup retry script tests
        shell: bash
        run: bash scripts/rustup-retry.test.sh
      - name: pin bump script tests
        run: python3 -B scripts/bump-pins.py --self-test
      # The comparison itself runs every night (distro-programs.yml).
      - name: distribution program comparison tests
        run: python3 -B -m unittest discover -s tests/guests/distro -p 'test_*.py'
      - name: rustfmt
        run: |
          cargo fmt --all --check
          cargo fmt --check --manifest-path fuzz/Cargo.toml
          cargo fmt --check --manifest-path tests/guests/hello-rs/Cargo.toml
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: decoder builds for wasm32
        run: cargo build --locked -p paludarium-decoder -p paludarium-mmu -p paludarium-cpu --target wasm32-unknown-unknown

  # The pinned nightly builds and tests everything; this keeps the native
  # crates building with the stable Rust that rust-version in Cargo.toml
  # names: the latest stable, which scripts/bump-pins.py moves weekly, so a
  # new release's lints arrive in that pull request rather than in unrelated
  # ones. Its clippy also has lints the nightly's does not. Clippy checks
  # without linking, so one Linux runner covers the Linux, macOS and Windows
  # targets. The WebAssembly build needs nightly features and is left out.
  stable-clippy:
    name: clippy (stable Rust of rust-version)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the stable Rust of rust-version
        # Retried: static.rust-lang.org downloads sometimes fail on CI.
        # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml for cargo, rustc and
        # rust-cache's key.
        uses: ./.github/actions/rust-toolchain
        with:
          rust-version: 'true'
          set-rustup-toolchain: 'true'
          args: >-
            toolchain install $RUST_TOOLCHAIN --profile minimal --component clippy
            --target x86_64-unknown-linux-gnu --target aarch64-apple-darwin
            --target x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: clippy for Linux, macOS and Windows
        run: |
          rustc --version
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc; do
            echo "::group::$target"
            cargo clippy --locked --workspace --all-targets --target "$target" -- -D warnings
            echo "::endgroup::"
          done

  dependencies:
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        # Retried: static.rust-lang.org downloads sometimes fail on CI.
        uses: ./.github/actions/rust-toolchain
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: cargo-deny
          cache: false
      # Licenses compatible with Apache-2.0, crates.io only, RustSec,
      # forbidden crates.
      - run: cargo deny --locked check

  differential:
    name: differential tests (x86-64 Linux)
    needs: [changes, quick]
    if: ${{ !cancelled() && needs.quick.result == 'success' && needs.changes.outputs.rust == 'true' }}
    # The native results are this kernel's (docs/design/quality.md).
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Restore before anything is written to target/: on a partial cache
      # match rust-cache cleans target/ first.
      - name: Install the pinned Rust toolchain
        # Retried: static.rust-lang.org downloads sometimes fail on CI.
        uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/guest-toolchain
        with:
          packages: musl-tools
      # The core-dump differential case needs Linux to write a core to the
      # working directory, as the kernel's default core_pattern does; the
      # runner hands cores to its crash handler instead.
      # Linux's default soft limit on them is 0, as a guest's is, but the runner
      # of Ubuntu 26.04 raises it for the steps it starts. Later steps are children
      # of this step's parent, the runner's worker, and take the limit from it.
      - name: Write cores to the working directory
        run: |
          sudo sysctl -w kernel.core_pattern=core kernel.core_uses_pid=0
          sudo prlimit --pid "$PPID" --core=0:
      - name: Check that this step took the core limit
        run: test "$(ulimit -Sc)" = 0
      # The AF_UNIX datagram case fills a queue to the kernel's default
      # net.unix.max_dgram_qlen, which the runner's systemd raises.
      - name: Keep the default AF_UNIX datagram queue length
        run: sudo sysctl -w net.unix.max_dgram_qlen=10
      # The chroot case takes CAP_SYS_CHROOT in a user namespace of its own,
      # which Linux grants but Ubuntu's AppArmor refuses there
      # (unprivileged_userns).
      - name: Let a new user namespace use its capabilities
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Record native architectural profile
        run: |
          mkdir -p target/encodings-guests
          uname -a > target/encodings-guests/uname.txt
          lscpu > target/encodings-guests/cpu.txt
      # Builds the guests from source, runs each natively and under the
      # emulator, compares stdout/stderr/exit status and prints the run times.
      - run: cargo test --locked -p paludarium-harness --test diff_core --test diff_instructions --test parallel_instructions --test diff_signals_time --test diff_terminal --test diff_encodings --test diff_processes --test diff_network -- --nocapture
      - name: Retain fresh encodings architectural observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: encodings-differential-observations
          path: target/encodings-guests/
          retention-days: 7

  # The same differential tests with the native JIT compiling every block the
  # first time it runs, so that compiled code, not the interpreter, runs the
  # guests' instructions (docs/design/quality.md).
  differential-jit:
    name: differential tests with the native JIT (x86-64 Linux)
    needs: [changes, quick]
    if: ${{ !cancelled() && needs.quick.result == 'success' && needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/guest-toolchain
        with:
          packages: musl-tools
      # As in the differential job.
      - name: Write cores to the working directory
        run: |
          sudo sysctl -w kernel.core_pattern=core kernel.core_uses_pid=0
          sudo prlimit --pid "$PPID" --core=0:
      - name: Check that this step took the core limit
        run: test "$(ulimit -Sc)" = 0
      - name: Keep the default AF_UNIX datagram queue length
        run: sudo sysctl -w net.unix.max_dgram_qlen=10
      # The chroot case takes CAP_SYS_CHROOT in a user namespace of its own,
      # which Linux grants but Ubuntu's AppArmor refuses there
      # (unprivileged_userns).
      - name: Let a new user namespace use its capabilities
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Differential tests, every block compiled the first time it runs
        env:
          PALUDARIUM_TEST_JIT: "1"
        run: cargo test --locked -p paludarium-harness --test diff_core --test diff_instructions --test parallel_instructions --test diff_signals_time --test diff_terminal --test diff_encodings --test diff_processes --test diff_network -- --nocapture

  coverage:
    name: line coverage >= 80%
    needs: [changes, quick]
    if: ${{ !cancelled() && needs.quick.result == 'success' && needs.changes.outputs.rust == 'true' }}
    # The native results are this kernel's (docs/design/quality.md).
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      PALUDARIUM_ENCODINGS_FULL_REPLAY: '1'
      PALUDARIUM_ENCODINGS_NATIVE_OBSERVATIONS: ${{ github.workspace }}/target/encodings-guests/observe.native
      PALUDARIUM_ENCODINGS_NATIVE_FAULTS: ${{ github.workspace }}/target/encodings-guests/fault-observe.native
      PALUDARIUM_ENCODINGS_NATIVE_CPUID: ${{ github.workspace }}/target/encodings-guests/cpuid-observe.native
      PALUDARIUM_THREADS_EMULATOR: ${{ github.workspace }}/target/llvm-cov-target/debug/paludarium
      PALUDARIUM_EVENTS_EMULATOR: ${{ github.workspace }}/target/llvm-cov-target/debug/paludarium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Restore before anything is written to target/: on a partial cache
      # match rust-cache cleans target/ first.
      - name: Install the pinned Rust toolchain
        # Retried: static.rust-lang.org downloads sometimes fail on CI.
        uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/guest-toolchain
        with:
          packages: musl-tools
      # The core-dump differential case needs Linux to write a core to the
      # working directory, as the kernel's default core_pattern does; the
      # runner hands cores to its crash handler instead.
      # Linux's default soft limit on them is 0, as a guest's is, but the runner
      # of Ubuntu 26.04 raises it for the steps it starts. Later steps are children
      # of this step's parent, the runner's worker, and take the limit from it.
      - name: Write cores to the working directory
        run: |
          sudo sysctl -w kernel.core_pattern=core kernel.core_uses_pid=0
          sudo prlimit --pid "$PPID" --core=0:
      - name: Check that this step took the core limit
        run: test "$(ulimit -Sc)" = 0
      # The AF_UNIX datagram case fills a queue to the kernel's default
      # net.unix.max_dgram_qlen, which the runner's systemd raises.
      - name: Keep the default AF_UNIX datagram queue length
        run: sudo sysctl -w net.unix.max_dgram_qlen=10
      # The chroot case takes CAP_SYS_CHROOT in a user namespace of its own,
      # which Linux grants but Ubuntu's AppArmor refuses there
      # (unprivileged_userns).
      - name: Let a new user namespace use its capabilities
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Record native architectural profile
        run: |
          mkdir -p target/encodings-guests
          uname -a > target/encodings-guests/uname.txt
          lscpu > target/encodings-guests/cpu.txt
      - name: Generate fresh encodings native inputs before instrumented library tests
        shell: bash
        run: |
          bash tests/guests/encodings/build.sh target/encodings-guests
          python3 - <<'PY_NATIVE'
          from pathlib import Path
          import subprocess, os, signal, json, hashlib
          out=Path('target/encodings-guests')
          rows=[]
          for name, expected_rows in [('observe',48224),('fault-observe',1637),('cpuid-observe',12)]:
              binary=out/name
              with (out/(name+'.native')).open('wb') as stdout, (out/(name+'.stderr')).open('wb') as stderr:
                  child=subprocess.Popen([str(binary.resolve())], stdout=stdout, stderr=stderr, start_new_session=True)
                  try:
                      code=child.wait(timeout=30)
                  except subprocess.TimeoutExpired:
                      os.killpg(child.pid,signal.SIGKILL)
                      child.wait()
                      raise
              data=(out/(name+'.native')).read_bytes()
              rows.append({'name':name,'exit':code,'rows':len(data.splitlines()),'binary_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),'output_sha256':hashlib.sha256(data).hexdigest()})
              (out/'native-input-receipt.json').write_text(json.dumps(rows,indent=2)+'\n')
              assert code==0 and len(data.splitlines())==expected_rows and not (out/(name+'.stderr')).read_bytes()
          PY_NATIVE
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: aqua:taiki-e/cargo-llvm-cov
          cache: false
      # Every gate fails below 80% of lines. The floors are never lowered.
      # The core gate and the workspace gate share one instrumented build and
      # one run of each test: the core packages' and the harness's tests run
      # first and the core gate reports on their profiles alone; the
      # remaining workspace tests then add theirs and the workspace gate
      # reports on all of them. Cargo builds the same units either way
      # (docs/design/quality.md). --no-report also leaves the target
      # directory as it is, as --no-clean does.
      - name: Core package line coverage >= 80%
        # Keep the same core production file set; fresh architectural tests live
        # in Harness and must execute when measuring the newly shared CPU code.
        run: |
          cargo llvm-cov clean --workspace
          (
            # shellcheck disable=SC1090
            source <(cargo llvm-cov show-env --sh)
            cargo build --locked -p paludarium --target-dir target/llvm-cov-target
          )
          read -r -a packages <<< "$CORE_PACKAGES"
          cargo llvm-cov --no-report --locked "${packages[@]}" -p paludarium-harness
          cargo llvm-cov report "${packages[@]}" -p paludarium-harness --ignore-filename-regex 'paludarium-harness/' --fail-under-lines 80
        env:
          # Instrumented independent cases run serially; race cases still
          # launch their own host workers and retain the 30-second watchdog.
          RUST_TEST_THREADS: "1"
      - name: Workspace line coverage >= 80%
        run: |
          read -r -a packages <<< "$CORE_PACKAGES"
          excludes=(--exclude paludarium-harness)
          for package in "${packages[@]}"; do
            if [ "$package" != -p ]; then
              excludes+=(--exclude "$package")
            fi
          done
          cargo llvm-cov --no-report --locked --workspace "${excludes[@]}"
          cargo llvm-cov report --workspace --fail-under-lines 80
        env:
          RUST_TEST_THREADS: "1"
      - name: Wasm changed Rust components line coverage >= 80%
        run: |
          cargo llvm-cov --locked -p paludarium-host -p paludarium-vfs -p paludarium-kernel -p paludarium-runtime -p paludarium-wasm --lib --ignore-filename-regex 'paludarium-(cpu|decoder|mmu|loader|types|jit|jit-native)/' --fail-under-lines 80 --lcov --output-path target/wasm-coverage.lcov
      - name: Retain wasm coverage observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wasm-coverage-lcov
          path: target/wasm-coverage.lcov
      # A report reads every test binary left in the target directory, and
      # cleans only the packages it measures. The terminal step used to start
      # from what the core run left, so remove what the other workspace
      # packages' tests built above.
      - name: Leave only the core run's test binaries
        run: |
          read -r -a packages <<< "$CORE_PACKAGES"
          core=" ${packages[*]} -p paludarium-harness "
          # A failure inside the loop's word list would not stop the step.
          set -o pipefail
          names=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[].name')
          test -n "$names"
          for package in $names; do
            if [[ "$core" != *" -p $package "* ]]; then
              cargo clean --locked --target-dir target/llvm-cov-target -p "$package"
            fi
          done
      - name: Terminal target crates line coverage >= 80%
        run: |
          cargo llvm-cov --locked -p paludarium-host -p paludarium-kernel -p paludarium-runtime -p paludarium -p paludarium-harness --lib --test diff_terminal --test command --ignore-filename-regex 'paludarium-(cpu|decoder|mmu|loader|types|vfs|jit|jit-native|harness)/' --fail-under-lines 80 --lcov --output-path target/terminal-coverage.lcov
          cargo llvm-cov report -p paludarium-host -p paludarium-kernel -p paludarium-runtime -p paludarium -p paludarium-harness --ignore-filename-regex 'paludarium-(cpu|decoder|mmu|loader|types|vfs|jit|jit-native|harness)/' | tee target/terminal-coverage-report.txt
        env:
          RUST_TEST_THREADS: "1"
      # The CPU and decoder only: the command crate (crates/paludarium), which
      # the harness builds and this run does not exercise, is left out of the
      # report as it is out of the measured lines.
      - name: Encodings CPU and Decoder line coverage >= 80%
        run: |
          cargo llvm-cov --locked -p paludarium-cpu -p paludarium-decoder -p paludarium-harness --lib --test diff_encodings --ignore-filename-regex 'paludarium-(types|mmu|host|kernel|loader|vfs|jit|jit-native|runtime|harness)/|crates/paludarium/' --fail-under-lines 80 --lcov --output-path target/encodings-coverage.lcov
          cargo llvm-cov report -p paludarium-cpu -p paludarium-decoder -p paludarium-harness --ignore-filename-regex 'paludarium-(types|mmu|host|kernel|loader|vfs|jit|jit-native|runtime|harness)/|crates/paludarium/' | tee target/encodings-coverage-report.txt
        env:
          RUST_TEST_THREADS: "1"
      # The rate each lcov gate compared with its floor, and how far it is
      # above it, so a pull request sees the margin shrink before a gate
      # fails. The gate compares llvm-cov's export of the same objects, profile
      # and ignored files as the lcov, so the two count the same lines; where
      # a gate prints a table, its TOTAL line is checked against them too.
      - name: Line coverage of the lcov gates
        if: ${{ !cancelled() }}
        run: |
          for gate in wasm terminal encodings; do
            lcov="target/$gate-coverage.lcov"
            [ -f "$lcov" ] || continue
            read -r hit lines < <(awk -F: '/^LF:/ { lines += $2 } /^LH:/ { hit += $2 } END { print hit + 0, lines + 0 }' "$lcov")
            if [ "$lines" -eq 0 ]; then
              echo "- $gate: no measured lines"
              continue
            fi
            floor=$(( (lines * 80 + 99) / 100 ))
            line=$(awk -v gate="$gate" -v hit="$hit" -v lines="$lines" -v floor="$floor" 'BEGIN { printf "- %s: %d of %d lines (%.2f%%), %d lines above the 80%% floor of %d", gate, hit, lines, 100 * hit / lines, hit - floor, floor }')
            report="target/$gate-coverage-report.txt"
            if [ -f "$report" ]; then
              total=$(sed 's/\x1b\[[0-9;]*m//g' "$report" | awk '$1 == "TOTAL" { print $8 - $9, $8 }')
              if [ "$total" = "$hit $lines" ]; then
                line+="; the report's TOTAL counts the same lines"
              else
                line+="; the report's TOTAL differs (hit and lines: ${total:-none}), see docs/design/quality.md"
              fi
            fi
            echo "$line"
          done | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain encodings coverage observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: encodings-coverage-lcov
          path: target/encodings-coverage.lcov
          retention-days: 7
      - name: Retain native states even when coverage fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: encodings-coverage-native-observations
          path: target/encodings-guests/
          retention-days: 7
      - name: Retain terminal coverage line observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: terminal-coverage-lcov
          path: target/terminal-coverage.lcov
          retention-days: 7

  # The quick stage: the expensive jobs above start only once these cheap
  # checks passed, so a head that fails them, or that a later push
  # supersedes early, does not take runners for the long jobs. A job that
  # needs this one is skipped when it fails; ci-ok still fails then, as it
  # needs this job too. A skip also passes down the needs, and a quick check
  # the change does not need is skipped (polyglot lint on a push, lint
  # without a Rust change), so each expensive job tests this job's own
  # result: if: ${{ !cancelled() && needs.quick.result == 'success' && ... }}.
  quick:
    name: quick checks
    # Not always(): a run a later push cancelled starts nothing more.
    if: ${{ !cancelled() }}
    needs:
      - changes
      - polyglot-lint
      - test-linux
      - lint
      - stable-clippy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done

  # The one required check: every job above passed or was not needed.
  # scripts/ci-changes.py --self-test checks that it needs every job, so a
  # job skipped because a job it needs failed never hides that failure.
  ci-ok:
    if: always()
    needs:
      - changes
      - wasm-programs
      - fuzz
      - fuzz-build
      - programs
      - polyglot-lint
      - docs
      - release-check
      - production-wasm
      - test-linux
      - test
      - lint
      - stable-clippy
      - dependencies
      - differential
      - differential-jit
      - coverage
      - quick
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
