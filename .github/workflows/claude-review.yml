name: Claude Review

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    uses: aletheia-works/.github/.github/workflows/claude-review.yml@224ce9e9c0d5ddd599e9984958b2e4dd9568ccb6 # v1.3.0
    with:
      rules: >-
        the principles in docs/guide/introduction.md, the supported features and limitations in docs/guide/, the architecture, design decisions and verification rules in docs/design/, CONTRIBUTING.md, docs/release.md for anything touching publication, and the README.md nearest the changed code
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
