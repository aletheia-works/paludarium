name: Check Conventional Commit

on:
  # edited: a retitled PR is checked again, as its title becomes the
  # squash-merge commit's header.
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    uses: aletheia-works/.github/.github/workflows/commitlint.yml@b24ce77ad773bcca239d8140aeb373f295572521 # v1.3.1
