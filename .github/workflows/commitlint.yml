name: Check Conventional Commit

on:
  # edited: a retitled PR is checked again, as its title becomes the
  # squash-merge commit's header.
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    uses: aletheia-works/.github/.github/workflows/commitlint.yml@f1e71b990c2fd7086e78931ba8609b96ac68104b # v1.4.1
