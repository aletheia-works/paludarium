name: Check Conventional Commit

on:
  # edited: a retitled PR is checked again, as its title becomes the
  # squash-merge commit's header.
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    uses: aletheia-works/.github/.github/workflows/commitlint.yml@2d85c4ddca01b35127a16915f0000bc54fdc85a6 # v1.4.0
