name: Check Conventional Commit

on:
  # edited: a retitled PR is checked again, as its title becomes the
  # squash-merge commit's header.
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # A merge queue (none is set up) waits for this required check too. The pull
  # request's run checked its commits and title; the reusable workflow's checks
  # run on pull_request, push and workflow_dispatch only, so here it passes.
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    uses: aletheia-works/.github/.github/workflows/commitlint.yml@f1e71b990c2fd7086e78931ba8609b96ac68104b # v1.4.1
