name: Dependabot auto-merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: aletheia-works/.github/.github/workflows/dependabot-auto-merge.yml@f1e71b990c2fd7086e78931ba8609b96ac68104b # v1.4.1
    # The bot sets up the merge so that it starts main's push workflows.
    # Only a Dependabot secret reaches a run that Dependabot starts.
    secrets:
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
