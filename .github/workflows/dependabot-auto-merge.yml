name: Dependabot auto-merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: aletheia-works/.github/.github/workflows/dependabot-auto-merge.yml@2d85c4ddca01b35127a16915f0000bc54fdc85a6 # v1.4.0
    # The bot sets up the merge so that it starts main's push workflows.
    # Only a Dependabot secret reaches a run that Dependabot starts.
    secrets:
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
