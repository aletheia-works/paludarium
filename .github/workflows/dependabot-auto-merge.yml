name: Dependabot auto-merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: aletheia-works/.github/.github/workflows/dependabot-auto-merge.yml@0ab4b956b12760b3926ac8f768e04432404a5182 # v1.3.4
    # The bot sets up the merge so that it starts main's push workflows.
    # Only a Dependabot secret reaches a run that Dependabot starts.
    secrets:
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
