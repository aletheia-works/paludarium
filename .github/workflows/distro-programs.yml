# Debian's own dynamically linked programs (shells, interpreters, compilers and
# tools) run natively and under paludarium in a Debian container, compared on
# exit status and standard output (tests/guests/distro/compare.py). Called by
# quality.yml every night. Actions are pinned by commit SHA and the default
# token is read-only.
name: Distribution programs

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  compare:
    name: distribution programs (x86-64 Linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the comparison's own logic
        run: python3 -B -m unittest discover -s tests/guests/distro -p 'test_*.py'
      # Debian's programs run in the container, whose glibc may be older than the
      # runner's, so the emulator is a static musl build.
      - uses: ./.github/actions/rust-toolchain
      - run: bash scripts/rustup-retry.sh target add x86_64-unknown-linux-musl --toolchain "$RUST_TOOLCHAIN"
      - uses: ./.github/actions/guest-toolchain
        with:
          packages: musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the emulator
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -p paludarium
      - name: Build the Debian image
        run: docker build --pull -t paludarium-distro tests/guests/distro
      - name: Compare the programs natively and under the emulator
        run: |
          mkdir -p target/distro
          docker run --rm \
            -v "$PWD/tests/guests/distro:/distro:ro" \
            -v "$PWD/target/x86_64-unknown-linux-musl/release/paludarium:/usr/local/bin/paludarium:ro" \
            -v "$PWD/target/distro:/out" \
            paludarium-distro \
            bash -c 'dpkg-query -W > /out/packages.txt &&
              python3 -B /distro/compare.py --emulator /usr/local/bin/paludarium --work /tmp/distro --output /out'
      - name: Retain the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: distribution-programs
          path: target/distro/
          retention-days: 14
