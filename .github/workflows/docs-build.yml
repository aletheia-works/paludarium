name: Build docs

# Builds the documentation site (VitePress, docs/). docs.yml calls it before
# deploying from main and ci.yml for pull requests; only a run that is not for
# a pull request uploads the Pages artifact.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # for the lastUpdated timestamps
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: bun
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist
