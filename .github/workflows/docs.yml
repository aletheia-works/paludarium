name: Docs

# The documentation site (VitePress, docs/). A push to main builds it
# (docs-build.yml) and deploys it to GitHub Pages
# (https://aletheia-works.github.io/paludarium/); ci.yml builds it for pull
# requests that change it.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mise.toml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/docs-build.yml

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: >-
      github.repository == 'aletheia-works/paludarium' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
