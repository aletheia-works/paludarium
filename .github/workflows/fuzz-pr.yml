name: Fuzz the MMU, filesystem and kernel targets
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target: [vfs_paths, load_elf, syscall_args, kernel_threads, kernel_futex, kernel_events, kernel_sockets]
    container:
      image: rust:1-bookworm
      options: --cap-add=SYS_PTRACE --security-opt=seccomp=unconfined --ulimit=stack=-1
    env:
      ASAN_OPTIONS: detect_leaks=1
      LSAN_OPTIONS: suppressions=/work/fuzz/lsan.supp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: ln -s "$GITHUB_WORKSPACE" /work
      - uses: ./.github/actions/rust-toolchain
        with:
          args: toolchain install $RUST_TOOLCHAIN --profile minimal
          set-rustup-toolchain: true
      - run: cargo install --locked --version 0.13.2 cargo-fuzz
      - run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins
      - name: Prepare the observed LLVM symbolizer for the decoder-table suppression
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl
          curl --fail --location https://apt.llvm.org/llvm-snapshot.gpg.key -o /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          printf '%s\n' 'deb https://apt.llvm.org/bookworm/ llvm-toolchain-bookworm main' > /etc/apt/sources.list.d/llvm-symbolizer.list
          apt-get update
          apt-cache policy llvm-24
          apt-get install -y --no-install-recommends llvm-24
      - name: Fresh 600 second ASan and LSan observation
        shell: bash
        run: |
          set -euo pipefail
          cd /work
          mkdir -p target/wasm-fuzz
          rustc -Vv > target/wasm-fuzz/toolchain.txt
          sha256sum Cargo.lock fuzz/Cargo.lock > target/wasm-fuzz/locks-before.sha256
          ASAN_SYMBOLIZER_PATH="$(command -v llvm-symbolizer-24)"
          export ASAN_SYMBOLIZER_PATH
          printf '%s\n' "$ASAN_SYMBOLIZER_PATH" > target/wasm-fuzz/symbolizer-path.txt
          "$ASAN_SYMBOLIZER_PATH" --version > target/wasm-fuzz/symbolizer-version.txt
          dpkg-query -W llvm-24 > target/wasm-fuzz/symbolizer-package.txt
          printf 'ASAN_OPTIONS=%s\nLSAN_OPTIONS=%s\nASAN_SYMBOLIZER_PATH=%s\n' "$ASAN_OPTIONS" "$LSAN_OPTIONS" "${ASAN_SYMBOLIZER_PATH:-}" > target/wasm-fuzz/settings.txt
          sha256sum fuzz/Cargo.lock > target/wasm-fuzz/lock-before.sha256
          date -u > target/wasm-fuzz/start.txt
          set +e
          cargo fuzz run --fuzz-dir fuzz --sanitizer address '${{ matrix.target }}' -- -seed=1 -max_total_time=600 -timeout=30 -rss_limit_mb=2048 2>&1 | tee target/wasm-fuzz/raw.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > target/wasm-fuzz/exit.txt
          date -u > target/wasm-fuzz/end.txt
          sha256sum fuzz/Cargo.lock > target/wasm-fuzz/lock-after.sha256
          cmp target/wasm-fuzz/lock-before.sha256 target/wasm-fuzz/lock-after.sha256
          sha256sum Cargo.lock fuzz/Cargo.lock > target/wasm-fuzz/locks-after.sha256
          cmp target/wasm-fuzz/locks-before.sha256 target/wasm-fuzz/locks-after.sha256
          sha256sum 'fuzz/target/x86_64-unknown-linux-gnu/release/${{ matrix.target }}' > target/wasm-fuzz/binary.sha256
          test "$status" = 0
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fuzz-pr-${{ matrix.target }}
          path: |
            target/wasm-fuzz
            fuzz/artifacts
            fuzz/target/x86_64-unknown-linux-gnu/release/${{ matrix.target }}
