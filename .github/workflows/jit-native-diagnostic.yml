name: Fixed guest programs (full quality)
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-metadata-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sudo unshare --net python3 tests/guests/programs/metadata.py target/programs/metadata/native-stat.json
      - name: Retain native stat evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: programs-native-metadata
          path: target/programs/metadata/
          retention-days: 7
  native-first:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools cmake perl make pkg-config
      - uses: ./.github/actions/rust-toolchain
        with:
          args: toolchain install nightly-2026-10-11 --profile minimal
      - shell: bash
        run: bash scripts/rustup-retry.sh target add x86_64-unknown-linux-musl --toolchain nightly-2026-10-11
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: cargo-deny
          cache: false
      - name: Runner readiness before native expectations
        run: |
          python3 scripts/programs-run.py --self-test
          python3 -m unittest discover -s tests/guests/programs/runner-tests -p 'test_*.py'
      - name: Build fixed unmodified static-musl guests and audit dependencies
        run: python3 tests/guests/programs/build.py target/guests/u10
      - name: Observe fresh native expectations without network or node
        run: sudo unshare --net python3 scripts/programs-run.py --native-only --guest-dir target/guests/u10 --output target/programs/native
      - name: Retain build and native evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: programs-native-first
          path: |
            target/guests/u10/build-receipt.json
            target/guests/u10/*-build.log
            target/guests/u10/*-dependencies.log
            target/guests/u10/aube-deny.toml
            target/guests/u10/licenses/
            target/guests/u10/probe
            target/guests/u10/aube
            target/programs/native/
          retention-days: 7
  differential:
    needs: native-first
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: programs-native-first
          path: target
      - run: chmod +x target/guests/u10/probe target/guests/u10/aube
      - uses: ./.github/actions/rust-toolchain
        with:
          args: toolchain install nightly-2026-10-11 --profile minimal
      - name: Compile C10 harness before network isolation
        run: |
          u10_cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          CARGO_HOME="$u10_cargo_home" cargo +nightly-2026-10-11 test --locked -p paludarium-harness --test diff_programs --no-run
      - name: Fresh native oracle then bounded C10 differential without network
        run: |
          u10_cargo="$(rustup which --toolchain nightly-2026-10-11 cargo)"
          u10_rustc="$(rustup which --toolchain nightly-2026-10-11 rustc)"
          u10_bin="$(dirname "$u10_cargo")"
          u10_cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          sudo unshare --net env GITHUB_SHA="$GITHUB_SHA" PATH="$u10_bin:$PATH" RUSTC="$u10_rustc" CARGO_HOME="$u10_cargo_home" "$u10_cargo" test --locked --offline -p paludarium-harness --test diff_programs -- --include-ignored --nocapture
      - name: Make differential evidence readable after isolated execution
        if: always()
        run: |
          if [ -d target/programs/differential ]; then
            sudo chown -R "$(id -u):$(id -g)" target/programs/differential
          fi
      - name: Retain differential observations and watchdog failure records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: programs-differential
          path: target/programs/differential/
          retention-days: 7
