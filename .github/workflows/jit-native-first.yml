name: Fresh native oracle before wasm translation
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-guests-native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.0'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools cmake perl make pkg-config
      - uses: ./.github/actions/rust-toolchain
        with:
          args: toolchain install nightly-2026-10-11 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview --target x86_64-unknown-linux-musl
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: cargo-deny
          cache: false
      - name: Actual compiler and runner readiness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/windows-native-first
          rustc -Vv > target/windows-native-first/compiler.txt
          cargo -V > target/windows-native-first/cargo.txt
          python --version > target/windows-native-first/python.txt
          cargo deny --version > target/windows-native-first/deny.txt
          sha256sum Cargo.lock fuzz/Cargo.lock rust-toolchain.toml deny.toml tests/guests/programs/source-lock.json > target/windows-native-first/inputs-before.sha256
          python -m unittest discover -s tests/guests/programs/runner-tests -p 'test_*.py'
          python scripts/windows-run.py --self-test
          cargo test --locked -p paludarium-host --test public_api
          python -m unittest discover -s tests/guests/windows/runner-tests -p 'test_*.py'
      - name: Fixed unmodified guests with license audits
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python tests/guests/programs/build.py target/guests/programs 2>&1 | tee target/windows-native-first/build.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > target/windows-native-first/build-exit.txt
          test "$status" = 0
      - name: Fresh Linux filesystem metadata for wasm comparison
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net "$(command -v python)" scripts/wasm-run.py --native-only --guest-dir target/guests/programs --output target/jit/native-metadata 2>&1 | tee target/windows-native-first/native-metadata.log
          python -c 'import json; r=json.load(open("target/jit/native-metadata/observations.json")); assert r["native_complete"] and len(r["rows"])==14; assert all(x["exit"]==0 and not x["timed_out"] and 0<=x["wall_seconds"]<=30 for x in r["rows"].values()); assert all("filesystem_metadata" in r["rows"][n] for n in ("version", "install", "frozen", "list"))'
      - name: Fresh isolated Linux fourteen cases
        shell: bash
        run: |
          set -euo pipefail
          set +e
          sudo unshare --net "$(command -v python)" scripts/windows-run.py --native-only --guests target/guests/programs --output target/windows/native 2>&1 | tee target/windows-native-first/native.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > target/windows-native-first/native-exit.txt
          test "$status" = 0
          python -c 'import json; r=json.load(open("target/windows/native/observations.json")); assert r["native_complete"] and len(r["rows"])==14; assert all(x["exit"]==0 and not x["timed_out"] and 0<=x["wall_seconds"]<=30 for x in r["rows"].values())'
          sudo unshare --net "$(command -v python)" scripts/windows-run.py --native-only --original-argv --guests target/guests/programs --output target/windows/native-original 2>&1 | tee target/windows-native-first/native-original.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > target/windows-native-first/native-original-exit.txt
          test "$status" = 0
      - name: Unchanged lock inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum Cargo.lock fuzz/Cargo.lock rust-toolchain.toml deny.toml tests/guests/programs/source-lock.json > target/windows-native-first/inputs-after.sha256
          cmp target/windows-native-first/inputs-before.sha256 target/windows-native-first/inputs-after.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-native-first
          path: |
            target/windows-native-first/
            target/windows/native/
            target/windows/native-original/
            target/jit/native-metadata/
            target/guests/programs/build-receipt.json
            target/guests/programs/*-build.log
            target/guests/programs/*-dependencies.log
            target/guests/programs/aube-deny.toml
            target/guests/programs/licenses/
            target/guests/programs/probe
            target/guests/programs/aube
          retention-days: 14

  instruction-native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 'latest'
      - name: Bounded native instruction observations
        shell: bash
        run: |
          set -euo pipefail
          node_path="$(command -v node)"
          case "$node_path" in /*/shims/*) exit 1 ;; /*) ;; *) exit 1 ;; esac
          mkdir -p target/jit-native-first
          "$node_path" --version > target/jit-native-first/node.txt
          uname -a > target/jit-native-first/platform.txt
          gcc --version > target/jit-native-first/compiler.txt
          python --version > target/jit-native-first/python.txt
          sha256sum tests/guests/jit/native.c tests/guests/jit/validation.py scripts/jit-native-first.py Cargo.lock fuzz/Cargo.lock rust-toolchain.toml > target/jit-native-first/before.sha256
          PALUDARIUM_TEST_NODE="$(command -v node)" python -m unittest discover -s tests/guests/jit -p 'test_*.py' -v
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror -fno-pie -no-pie tests/guests/jit/native.c -o target/jit-native-first/oracle
          python scripts/jit-native-first.py --binary target/jit-native-first/oracle --output target/jit-native-first/observations.json
          sha256sum tests/guests/jit/native.c tests/guests/jit/validation.py scripts/jit-native-first.py Cargo.lock fuzz/Cargo.lock rust-toolchain.toml > target/jit-native-first/after.sha256
          cmp target/jit-native-first/before.sha256 target/jit-native-first/after.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: jit-instruction-native
          path: target/jit-native-first/
          retention-days: 14
