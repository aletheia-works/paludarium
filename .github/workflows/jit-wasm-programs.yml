name: Wasm guest programs with the JIT on and off
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'
          check-latest: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools cmake perl make pkg-config
      - uses: ./.github/actions/rust-toolchain
        with:
          args: toolchain install $RUST_TOOLCHAIN --profile minimal --component rust-src
      - shell: bash
        run: bash scripts/rustup-retry.sh target add x86_64-unknown-linux-musl wasm32-unknown-unknown --toolchain "$RUST_TOOLCHAIN"
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: cargo-deny
          cache: false
      - name: Runner tests
        run: python3 -m unittest discover -s tests/guests/wasm/runner-tests -p 'test_*.py'
      - name: Build fixed guests and audit dependencies
        run: python3 tests/guests/programs/build.py target/guests/programs
      - name: Fresh Linux oracle with filesystem metadata
        run: sudo unshare --net python3 scripts/wasm-run.py --native-only --guest-dir target/guests/programs --output target/wasm/native
      - name: Build one production wasm module for every environment
        run: bash mise-tasks/wasm/build.sh
      - name: Preserve inputs and fresh oracle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wasm-acceptance-inputs
          path: |
            target/guests/programs/probe
            target/guests/programs/aube
            target/guests/programs/ripgrep
            target/guests/programs/build-receipt.json
            target/guests/programs/*-build.log
            target/guests/programs/*-dependencies.log
            target/guests/programs/aube-deny.toml
            target/guests/programs/licenses/
            target/wasm/native/
            packages/paludarium-wasm/paludarium.wasm
          retention-days: 7
  differential:
    needs: build-oracle
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            environment: node
          - os: ubuntu-latest
            environment: chromium
          - os: ubuntu-latest
            environment: firefox
          - os: macos-latest
            environment: safari
          # JavaScriptCore on x86-64, which Safari on macOS (arm64) does not
          # cover: it once miscompiled a CPU flag helper (#113). Its report is
          # no release evidence source (scripts/release/acceptance.py), but a
          # failure here fails the quality run a release needs.
          - os: ubuntu-latest
            environment: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Use a job-local rustup home
        # GitHub-hosted runners sometimes ship a partially installed toolchain in
        # ~/.rustup, which makes rustup fail with "detected conflict".
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 'latest'
      - name: Latest independently pinned npm CLI
        run: |
          npm install --global npm@12.2.0
          test "$(npm --version)" = 12.2.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: wasm-acceptance-inputs
          path: .
      - name: Install pinned browser driver
        if: matrix.environment == 'chromium' || matrix.environment == 'firefox' || matrix.environment == 'webkit'
        run: npm ci --prefix spikes/wasm-threads
      - name: Install Playwright browser
        if: matrix.environment == 'chromium' || matrix.environment == 'firefox' || matrix.environment == 'webkit'
        uses: aletheia-works/.github/actions/install-playwright@237aeceec82d1ac86155fae871a80d4c1b436845 # v1.2.0
        with:
          browsers: ${{ matrix.environment }}
          command: node spikes/wasm-threads/node_modules/playwright/cli.js
      - name: Enable actual Safari on CI runner
        if: matrix.environment == 'safari'
        run: sudo safaridriver --enable
      - name: Project Rust source for strict control module
        if: matrix.environment == 'node'
        run: bash scripts/rustup-retry.sh toolchain install "$(bash scripts/rust-toolchain.sh)" --profile minimal --component rust-src
      - name: Fresh same-source control for existing Node boundary entry
        if: matrix.environment == 'node'
        run: python3 -B scripts/build-jit-cost-profile.py --kind acceptance-control --baseline-head "${{ github.sha }}"
      - name: Launcher component and C12 boundary tests
        env:
          PALUDARIUM_JIT_CONTROL_WASM: target/jit-cost-profile/acceptance-control.wasm
        if: matrix.environment == 'node'
        run: |
          mkdir -p target/wasm/node/v8
          export NODE_V8_COVERAGE="$PWD/target/wasm/node/v8"
          node --test packages/paludarium-wasm/tests/wasm-*.test.mjs packages/paludarium-wasm/tests/jit-*.test.mjs
          node packages/paludarium-wasm/tests/wasm-api-check.mjs packages/paludarium-wasm/paludarium.wasm
      - name: Compare identical fourteen cases in both execution modes
        env:
          JIT_ENVIRONMENT: ${{ matrix.environment }}
        run: python3 -B scripts/jit-run.py --environment "$JIT_ENVIRONMENT" --wasm packages/paludarium-wasm/paludarium.wasm --native target/wasm/native/observations.json --guests target/guests/programs --output "target/wasm/$JIT_ENVIRONMENT"
      - name: Fixed production JavaScript coverage
        if: matrix.environment == 'node'
        run: node packages/paludarium-wasm/tests/jit-coverage.mjs target/wasm/node/v8 target/wasm/node/js-coverage.json
      - name: Frozen paired full-probe performance
        # Measured by hand before a release and by the nightly schedule; never on push or pull_request.
        if: matrix.environment == 'node' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        continue-on-error: true
        run: node packages/paludarium-wasm/tests/jit-performance-check.mjs packages/paludarium-wasm/paludarium.wasm target/wasm/native/observations.json target/guests/programs target/wasm/node/performance
      - name: Preserve raw results and cleanup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wasm-${{ matrix.environment }}
          path: target/wasm/${{ matrix.environment }}/
          retention-days: 7
