name: Polyglot lint autofix apply

# Applies the patch lint-autofix.yml produced to the pull request branch, as in
# the other aletheia-works repositories. The patch comes from the pull request's
# own code, so it is checked first: only files the fixers edit, no workflows,
# no new, deleted, renamed or re-moded files, and only while the branch has not
# moved. aletheia-works-bot commits through GitHub's API, so GitHub signs the commit.

on:
  workflow_run:
    workflows: ['Polyglot lint autofix']
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: >-
    lint-autofix-apply-${{ github.event.workflow_run.head_repository.full_name }}-${{
    github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply polyglot lint autofix
    if: |
      github.repository_owner == 'aletheia-works' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download autofix patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lint-autofix-patch
          path: ./autofix-in
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect patch
        id: patch
        run: |
          set -euo pipefail
          patch=./autofix-in/autofix.patch
          if [ ! -s "${patch}" ]; then
            echo "No autofix changes to apply."
            echo "apply=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # The PR's own mise.toml produced this patch, so it is untrusted.
          fail() { echo "::error::Autofix patch rejected: $1"; exit 1; }
          if grep -qE '^(index [0-9a-f]+\.\.[0-9a-f]+ (120000|160000)|new file mode|deleted file mode|old mode|new mode|rename from|rename to|copy from|copy to|similarity index|dissimilarity index|Binary files|GIT binary patch)' "${patch}"; then
            fail "it creates, deletes, renames, copies or re-modes a file, edits a symlink or submodule, or is binary"
          fi
          allowed='\.(py|rs|toml|md)$'
          check_path() {
            case "$1" in
              .github/workflows/* | ../* | */../* | */.. | /*) fail "path not allowed: $1" ;;
            esac
            [[ "$1" =~ ${allowed} ]] || fail "not a file type the fixers touch: $1"
          }
          echo "Patch touches:"
          headers=0
          in_header=false
          while IFS= read -r line; do
            case "${line}" in
              'diff --git '*)
                headers=$((headers + 1))
                in_header=true
                rest=${line#diff --git a/}
                [ "${rest}" != "${line}" ] || fail "unexpected header: ${line}"
                path=${rest:0:$(((${#rest} - 3) / 2))}
                [ "${rest}" = "${path} b/${path}" ] || fail "header names two paths: ${line}"
                check_path "${path}"
                echo "  ${path}"
                ;;
              '@@'*) in_header=false ;;
              '--- '* | '+++ '*)
                if ${in_header}; then
                  p=${line:4}
                  case "${p}" in
                    a/* | b/*) check_path "${p:2}" ;;
                    *) fail "unexpected path line: ${line}" ;;
                  esac
                fi
                ;;
            esac
          done <"${patch}"
          [ "${headers}" -gt 0 ] || fail "no file headers"
          echo "apply=true" >> "${GITHUB_OUTPUT}"

      - name: Checkout PR head (read-only)
        if: steps.patch.outputs.apply == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true
          path: pr

      - name: Get an aletheia-works-bot token
        if: steps.patch.outputs.apply == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write

      # The commit is created through GitHub's API as aletheia-works-bot, so GitHub
      # signs it (as vivarium's bot-pull-request action does). A pull request from
      # a fork needs "Allow edits by maintainers" for the bot to write to it.
      - name: Commit the fixes as aletheia-works-bot
        if: steps.patch.outputs.apply == 'true'
        working-directory: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEADLINE: "style: polyglot lint autofix (cargo fmt/clippy, ruff, tombi, rumdl)"
        run: |
          set -euo pipefail

          current="$(gh api "repos/${HEAD_REPO}/commits/${HEAD_BRANCH}" --jq .sha)"
          if [ "${current}" != "${HEAD_SHA}" ]; then
            echo "Branch moved (${HEAD_SHA} -> ${current}); skipping stale patch."
            exit 0
          fi

          git apply --index "${GITHUB_WORKSPACE}/autofix-in/autofix.patch"
          echo '[]' > "${RUNNER_TEMP}/additions.json"
          while IFS= read -r -d '' meta && IFS= read -r -d '' path; do
            read -r _ new_mode _ _ status <<< "${meta#:}"
            if [ "${status}" != M ] || [ "${new_mode}" != 100644 ]; then
              echo "::error::${path}: ${status} to mode ${new_mode}; only edits of regular files can be committed."
              exit 1
            fi
            git show ":${path}" | base64 -w0 > "${RUNNER_TEMP}/blob"
            jq -c --arg p "${path}" --rawfile c "${RUNNER_TEMP}/blob" '. + [{path: $p, contents: $c}]' \
              "${RUNNER_TEMP}/additions.json" > "${RUNNER_TEMP}/next.json"
            mv "${RUNNER_TEMP}/next.json" "${RUNNER_TEMP}/additions.json"
          done < <(git diff --cached --no-renames --raw -z HEAD)

          # shellcheck disable=SC2016
          jq -n --arg repo "${HEAD_REPO}" --arg branch "${HEAD_BRANCH}" --arg head "${HEAD_SHA}" \
            --arg headline "${HEADLINE}" --slurpfile additions "${RUNNER_TEMP}/additions.json" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: $headline},
                fileChanges: {additions: $additions[0]}
              }}
            }' > "${RUNNER_TEMP}/commit.json"
          if ! gh api graphql --input "${RUNNER_TEMP}/commit.json" --jq .data.createCommitOnBranch.commit.oid \
            > "${RUNNER_TEMP}/commit.oid" 2> "${RUNNER_TEMP}/commit.err"; then
            cat "${RUNNER_TEMP}/commit.err" >&2
            echo "::error::aletheia-works-bot could not commit to ${HEAD_REPO}:${HEAD_BRANCH}. For a pull request from a fork, enable \"Allow edits by maintainers\"; or run mise run lint:all:fix and push the fixes."
            exit 1
          fi
          commit="$(cat "${RUNNER_TEMP}/commit.oid")"
          echo "Committed ${commit} to ${HEAD_REPO}:${HEAD_BRANCH}."
          if [ "$(gh api "repos/${HEAD_REPO}/commits/${commit}" --jq .commit.verification.verified)" != true ]; then
            echo "::warning::${commit} is not marked verified."
          fi
