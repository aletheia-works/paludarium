name: Polyglot lint autofix

# Runs `mise run lint:all:fix` on the pull request head with a read-only token
# and uploads the resulting diff. lint-autofix-apply.yml checks that patch and
# pushes it to the pull request branch, as in the other aletheia-works
# repositories. Actions are pinned by commit SHA.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Polyglot lint autofix
    if: github.repository_owner == 'aletheia-works'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        # Retried: static.rust-lang.org downloads sometimes fail on CI. mise then
        # finds the toolchain of rust-toolchain.toml already installed.
        uses: ./.github/actions/rust-toolchain
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: false

      # Fixers exit non-zero after applying what they can when an unfixable issue
      # remains, so keep the patch; Polyglot lint fails the PR for what is left.
      - name: Run polyglot lint autofix
        run: |
          if ! mise run lint:all:fix; then
            echo "::warning::lint:all:fix exited non-zero: an issue it cannot fix is left, or a tool failed. Polyglot lint reports what remains."
          fi

      - name: Capture autofix patch
        run: |
          set -euo pipefail
          mkdir -p autofix-out
          git diff --binary > autofix-out/autofix.patch
          if [ -s autofix-out/autofix.patch ]; then
            echo "Autofix produced changes in:"
            git diff --name-only
          else
            echo "No autofix changes."
          fi

      - name: Upload autofix patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-autofix-patch
          path: autofix-out/autofix.patch
          retention-days: 1
          if-no-files-found: error
