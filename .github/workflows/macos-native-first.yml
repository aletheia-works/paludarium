name: Fresh Linux oracle for the macOS host
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-first:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'
          check-latest: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools cmake perl make pkg-config
      - uses: ./.github/actions/rust-toolchain
        with:
          args: toolchain install $RUST_TOOLCHAIN --profile minimal --component rustfmt --component clippy --component llvm-tools-preview --target x86_64-unknown-linux-musl
          set-rustup-toolchain: true
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: cargo-deny
          cache: false
      - name: Actual compiler and runner readiness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/macos-native-first
          rustc -Vv > target/macos-native-first/compiler.txt
          cargo -V > target/macos-native-first/cargo.txt
          python --version > target/macos-native-first/python.txt
          cargo deny --version > target/macos-native-first/deny.txt
          sha256sum Cargo.lock fuzz/Cargo.lock rust-toolchain.toml tests/guests/programs/source-lock.json > target/macos-native-first/inputs-before.sha256
          python scripts/macos-run.py --self-test
          cargo test --locked -p paludarium-host --lib signals_time_tests:: -- --test-threads=1
      - name: Fixed unmodified guests with license audits
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python tests/guests/programs/build.py target/guests/programs 2>&1 | tee target/macos-native-first/build.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > target/macos-native-first/build-exit.txt
          test "$status" = 0
      - name: Fresh isolated Linux fourteen cases
        shell: bash
        run: |
          set -euo pipefail
          set +e
          sudo unshare --net "$(command -v python)" scripts/macos-run.py --native-only --guest-dir target/guests/programs --output target/macos/native 2>&1 | tee target/macos-native-first/native.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > target/macos-native-first/native-exit.txt
          test "$status" = 0
          python -c 'import json; r=json.load(open("target/macos/native/observations.json")); assert r["native_complete"] and len(r["rows"])==14; assert all(x["exit"]==0 and not x["timed_out"] and 0<=x["wall_seconds"]<=30 for x in r["rows"].values())'
          sudo unshare --net "$(command -v python)" scripts/macos-run.py --native-only --original-argv --guest-dir target/guests/programs --output target/macos/native-original 2>&1 | tee target/macos-native-first/native-original.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > target/macos-native-first/native-original-exit.txt
          test "$status" = 0
      - name: Unchanged lock inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum Cargo.lock fuzz/Cargo.lock rust-toolchain.toml tests/guests/programs/source-lock.json > target/macos-native-first/inputs-after.sha256
          cmp target/macos-native-first/inputs-before.sha256 target/macos-native-first/inputs-after.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: macos-native-first
          path: |
            target/macos-native-first/
            target/macos/native/
            target/macos/native-original/
            target/guests/programs/build-receipt.json
            target/guests/programs/*-build.log
            target/guests/programs/*-dependencies.log
            target/guests/programs/aube-deny.toml
            target/guests/programs/coreutils-deny.toml
            target/guests/programs/licenses/
            target/guests/programs/probe
            target/guests/programs/aube
            target/guests/programs/ripgrep
            target/guests/programs/coreutils
          retention-days: 14
