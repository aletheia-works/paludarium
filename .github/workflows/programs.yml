name: Fixed guest programs
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-metadata-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sudo unshare --net python3 tests/guests/programs/metadata.py target/programs/metadata/native-stat.json
      - name: Retain native stat evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: programs-native-metadata
          path: target/programs/metadata/
          retention-days: 7
  native-first:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'
          check-latest: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools cmake perl make pkg-config
      - uses: ./.github/actions/rust-toolchain
        with:
          args: toolchain install $RUST_TOOLCHAIN --profile minimal
      - shell: bash
        run: bash scripts/rustup-retry.sh target add x86_64-unknown-linux-musl --toolchain "$RUST_TOOLCHAIN"
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: cargo-deny
          cache: false
      - name: Runner readiness before native expectations
        run: |
          python3 scripts/programs-run.py --self-test
          python3 -m unittest discover -s tests/guests/programs/runner-tests -p 'test_*.py'
      - name: Build fixed unmodified static-musl guests and audit dependencies
        run: python tests/guests/programs/build.py target/guests/programs
      - name: Observe fresh native expectations without network or node
        run: sudo unshare --net python3 scripts/programs-run.py --native-only --guest-dir target/guests/programs --output target/programs/native
      - name: Retain build and native evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: programs-native-first
          path: |
            target/guests/programs/build-receipt.json
            target/guests/programs/*-build.log
            target/guests/programs/*-dependencies.log
            target/guests/programs/aube-deny.toml
            target/guests/programs/licenses/
            target/guests/programs/probe
            target/guests/programs/aube
            target/guests/programs/ripgrep
            target/programs/native/
          retention-days: 7
  differential:
    needs: native-first
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: programs-native-first
          path: target
      - run: chmod +x target/guests/programs/probe target/guests/programs/aube target/guests/programs/ripgrep
      - uses: ./.github/actions/rust-toolchain
        with:
          args: toolchain install $RUST_TOOLCHAIN --profile minimal
      - name: Compile the harness before network isolation
        run: |
          programs_cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          CARGO_HOME="$programs_cargo_home" cargo +"$RUST_TOOLCHAIN" test --locked -p paludarium-harness --test diff_programs --no-run
      - name: Fresh native oracle then bounded differential without network
        run: |
          programs_cargo="$(rustup which --toolchain "$RUST_TOOLCHAIN" cargo)"
          programs_rustc="$(rustup which --toolchain "$RUST_TOOLCHAIN" rustc)"
          programs_bin="$(dirname "$programs_cargo")"
          programs_cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          sudo unshare --net env GITHUB_SHA="$GITHUB_SHA" PATH="$programs_bin:$PATH" RUSTC="$programs_rustc" CARGO_HOME="$programs_cargo_home" "$programs_cargo" test --locked --offline -p paludarium-harness --test diff_programs -- --include-ignored --nocapture
      - name: Make differential evidence readable after isolated execution
        if: always()
        run: |
          if [ -d target/programs/differential ]; then
            sudo chown -R "$(id -u):$(id -g)" target/programs/differential
          fi
      - name: Retain differential observations and watchdog failure records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: programs-differential
          path: target/programs/differential/
          retention-days: 7
