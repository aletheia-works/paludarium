name: Publish

# While the workspace version has no tag yet, a push to main releases that
# head, in the order the other Rust projects use (publish first, tag last):
#   1. evidence: scripts/release/evidence.py waits for the CI push run,
#      dispatches the quality runs and then u15-acceptance once each, and
#      waits for all of them (docs/release.md).
#   2. preflight and packages: the signed head, the release environment and
#      the package check of that head.
#   3. publish: every crate and the npm package by Trusted Publishing (OIDC)
#      only, without waiting for an approval.
#   4. tag: the tag and the GitHub release, only after all of it succeeded,
#      so a version that was not published never gets a tag.
# A stopped job is re-run in the same run; nothing is tagged until then.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  evidence:
    name: Produce same-head evidence
    if: >-
      github.repository == 'aletheia-works/paludarium' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write
    outputs:
      ready: ${{ steps.evidence.outputs.ready }}
      version: ${{ steps.evidence.outputs.version }}
      head: ${{ steps.evidence.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.0'
      - name: Dispatch and wait for the same-head quality and acceptance runs
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/release/evidence.py

  preflight:
    needs: evidence
    if: needs.evidence.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.0'
      - name: Verify actual repository, untagged version, signed main head and environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/release/check.py --mode preflight
  packages:
    needs: preflight
    uses: ./.github/workflows/release-check.yml
    permissions:
      contents: read
  publish:
    needs: [evidence, preflight, packages]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Use a job-local rustup home
        # GitHub-hosted runners sometimes ship a partially installed toolchain in
        # ~/.rustup, which makes rustup fail with "detected conflict".
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: u15-package
          path: target/u15
      - name: Obtain same-head acceptance evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/release/check.py --mode fetch-acceptance --output target/u15/release-evidence.json
      - name: Verify official runs and all acceptance conditions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/release/check.py --mode authorize --evidence target/u15/release-evidence.json
      # Trusted Publishing (OIDC) only: without a registered Trusted Publisher
      # this exchange fails, before any upload.
      - name: Temporary crates.io OIDC token (revoked by action post step)
        id: crates
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Fixed tools for publishing verified artifacts
        run: |
          npm install --prefix target/u15/tools --ignore-scripts npm@12.2.0
          bash scripts/rustup-retry.sh toolchain install nightly-2026-10-11 --profile minimal
      - name: Publish in dependency order and verify registry digests
        env:
          GH_TOKEN: ${{ github.token }}
          U15_OIDC_CRATES_IO_TOKEN: ${{ steps.crates.outputs.token }}
        run: |
          PALUDARIUM_TEST_NODE="$(command -v node)" PALUDARIUM_RELEASE_NPM="$GITHUB_WORKSPACE/target/u15/tools/node_modules/npm/bin/npm-cli.js" python -B scripts/release/check.py --mode publish --evidence target/u15/release-evidence.json
      # Step24 (review 04, finding 5): keep the progress record and the command receipts after the
      # runner is gone, also when publishing stopped. They hold no token values (check.py records none).
      - name: Keep the publication progress and command receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: u15-publication-progress-attempt-${{ github.run_attempt }}
          path: |
            target/u15/publication-progress.json
            target/u15/dry-*/receipt.json
            target/u15/publish-*/receipt.json
          if-no-files-found: warn
          retention-days: 90

  tag:
    name: Create tag and GitHub release
    needs: [evidence, publish]
    if: needs.evidence.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Nothing starts from the tag any more, so the workflow's own token is
    # enough and this workflow holds no secret at all.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.evidence.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.0'

      - name: Tag the published v${{ needs.evidence.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.evidence.outputs.version }}
          HEAD_SHA: ${{ needs.evidence.outputs.head }}
        run: |
          mkdir -p target
          python -B scripts/release/evidence.py notes "$VERSION" CHANGELOG.md > target/release-notes.md
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$HEAD_SHA" --title "v$VERSION" --notes-file target/release-notes.md

      # What Release Please does when it tags: the merged release PR stops
      # being pending, so Release Please opens the next release PR again.
      - name: Mark the merged release PR as tagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state merged --label 'autorelease: pending' --json number --jq '.[].number' |
            while read -r number; do
              gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --remove-label 'autorelease: pending' --add-label 'autorelease: tagged'
            done
