# Same-head release acceptance evidence. publish.yml's evidence job (or
# a person) dispatches this on main of the upstream repository after the
# same-head quality runs listed in docs/release.md have completed. It only reads official run, job and
# artifact metadata and produces one artifact, release-acceptance, holding
# release-evidence.json. It never tags, approves or publishes. Actions are
# pinned by commit SHA and the token is read-only.
name: Same-head release acceptance evidence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: release-acceptance-${{ github.sha }}
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
          check-latest: true
      - name: Collect same-head official quality and acceptance evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/release/acceptance.py --output target/release-evidence/release-evidence.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-acceptance
          path: target/release-evidence/release-evidence.json
          if-no-files-found: error
