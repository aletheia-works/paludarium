name: Release package checks
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Use a job-local rustup home
        # GitHub-hosted runners sometimes ship a partially installed toolchain in
        # ~/.rustup, which makes rustup fail with "detected conflict".
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
      - name: Fixed project-local verification tools
        run: |
          python -m venv .venv-u15
          .venv-u15/bin/python -m pip install coverage==7.16.2
          npm install --prefix target/u15/tools --ignore-scripts npm@12.2.0
          bash scripts/rustup-retry.sh toolchain install nightly-2026-10-11 --profile minimal --component rust-src --target wasm32-unknown-unknown
          bash scripts/rustup-retry.sh toolchain install 1.99.1 --profile minimal
      - name: Release unit and mock integration tests
        run: .venv-u15/bin/python -B -m coverage run --data-file=target/u15/python.coverage --include='*/scripts/release/policy.py,*/scripts/release/package.py,*/scripts/release/check.py,*/scripts/release/acceptance.py' -m unittest discover -s tests/release -p 'test_*.py' -v
      - name: Static configuration
        run: .venv-u15/bin/python -B -m coverage run --append --data-file=target/u15/python.coverage scripts/release/check.py --mode validate
      - name: Actual eleven crates, isolated registry and same npm tarball
        run: |
          PALUDARIUM_TEST_NODE="$(command -v node)" PALUDARIUM_RELEASE_NPM="$GITHUB_WORKSPACE/target/u15/tools/node_modules/npm/bin/npm-cli.js" .venv-u15/bin/python -B -m coverage run --append --data-file=target/u15/python.coverage scripts/release/check.py --mode package-check --output target/u15/package-result.json
      - name: Each fixed release component retains 80 percent
        run: |
          .venv-u15/bin/python -m coverage json --data-file=target/u15/python.coverage -o target/u15/python-coverage.json
          .venv-u15/bin/python -m coverage report --data-file=target/u15/python.coverage --fail-under=80
          .venv-u15/bin/python -c 'import json; d=json.load(open("target/u15/python-coverage.json")); rows={k:v for k,v in d["files"].items() if k in ("scripts/release/policy.py","scripts/release/package.py","scripts/release/check.py","scripts/release/acceptance.py")}; assert len(rows)==4; assert all(r["summary"]["percent_covered"]>=80 for r in rows.values())'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: u15-package
          if-no-files-found: error
          path: |
            target/u15/package-result.json
            target/u15/python-coverage.json
            target/u15/package-*/*.tgz
            target/u15/package-*/source/target/package/*.crate
            target/u15/package-*/**/receipt.json
            target/u15/package-*/**/stdout.bin
            target/u15/package-*/**/stderr.bin
            target/u15/package-*/source.json
            target/u15/package-*/failure.json
            target/u15/package-*/registry-cleanup.json
            target/u15/package-*/consumer/Cargo.lock
            target/u15/package-*/source-snapshot.zip
