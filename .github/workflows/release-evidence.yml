name: Release evidence

# While the workspace version has no tag yet, a push to main produces the
# same-head evidence by itself (scripts/release/evidence.py): it waits for
# the CI push run, dispatches the quality runs and then u15-acceptance once
# each, and creates the tag and GitHub release on that head when all of them
# succeeded. The tag starts publish.yml, which publishes without waiting for
# an approval. Only the first publication is automated so far.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-evidence
  cancel-in-progress: false

jobs:
  evidence:
    name: Produce same-head evidence
    if: >-
      github.repository == 'aletheia-works/paludarium' &&
      github.ref == 'refs/heads/main' &&
      vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write
    outputs:
      ready: ${{ steps.evidence.outputs.ready }}
      version: ${{ steps.evidence.outputs.version }}
      head: ${{ steps.evidence.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.0'
      - name: Dispatch and wait for the same-head quality and acceptance runs
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/release/evidence.py

  tag:
    name: Create tag and GitHub release
    needs: evidence
    if: needs.evidence.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.evidence.outputs.head }}
          persist-credentials: false

      # A tag created with the workflow's own token would not start publish.yml.
      - name: Get an aletheia-works-bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Create v${{ needs.evidence.outputs.version }} on the evidence head
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.evidence.outputs.version }}
          HEAD_SHA: ${{ needs.evidence.outputs.head }}
        run: |
          mkdir -p target
          awk -v heading="## $VERSION " 'index($0, heading) == 1 {found = 1; next} found && /^## / {exit} found' CHANGELOG.md > target/release-notes.md
          test -s target/release-notes.md
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$HEAD_SHA" --title "v$VERSION" --notes-file target/release-notes.md

      # What Release Please does when it tags: the merged release PR stops
      # being pending, so Release Please opens the next release PR again.
      - name: Mark the merged release PR as tagged
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state merged --label 'autorelease: pending' --json number --jq '.[].number' |
            while read -r number; do
              gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --remove-label 'autorelease: pending' --add-label 'autorelease: tagged'
            done
