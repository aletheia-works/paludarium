name: Release

# Release Please keeps the release PR up to date on every push to main.
# Merging that PR only bumps the versions. It never creates the tag or the
# GitHub release: publish.yml produces the same-head evidence for the merge
# commit, publishes it, and tags it last (docs/release.md).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Terraform Apply']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    name: Update release PR or create release
    if: >-
      github.repository == 'aletheia-works/paludarium' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get an aletheia-works-bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Require the IaC-managed release labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/labels/autorelease%3A%20pending" > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/labels/autorelease%3A%20tagged" > /dev/null

      - name: Update release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          skip-github-release: true
