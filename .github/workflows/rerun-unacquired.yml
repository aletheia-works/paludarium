name: Rerun jobs no runner took

# GitHub cancels a job that no hosted runner acquires (macOS arm64 runners run
# short of capacity) with an annotation and no step run. When those are a CI
# run's only failures, but for ci-ok, which fails because of them,
# scripts/ci-rerun.py reruns the failed jobs, at most twice; ci-ok keeps
# failing until they ran. A job that ran a step and failed is never rerun.
# workflow_run runs this file and the script as they are on main, never a pull
# request's. Actions are pinned by commit SHA.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: rerun-unacquired-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun:
    name: rerun jobs no runner took
    if: >-
      github.repository_owner == 'aletheia-works' &&
      (github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # gh run rerun --failed.
      actions: write
      # The jobs' annotations.
      checks: read
      # The checkout of scripts/ci-rerun.py.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-rerun.py
          sparse-checkout-cone-mode: false
      - run: python3 -B scripts/ci-rerun.py
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          # The attempt that completed: an event can come after the next started.
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
