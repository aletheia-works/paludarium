# Checks that every scheduled workflow actually ran. A run that fails before its
# first job (startup_failure, for example a workflow file error) runs none of its
# own reporting, and GitHub disables schedules after 60 days without repository
# activity; neither tells anyone. Every day this looks at each scheduled
# workflow's latest scheduled run and opens an Issue when one did not start, did
# not run in time or is disabled (a later problem comments on it). The next day
# with no problem closes it.
name: Schedule watch

on:
  schedule:
    # Five and a half hours after nightly.yml starts.
    - cron: '47 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    if: github.repository_owner == 'aletheia-works'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: Scheduled workflows did not run
    steps:
      - name: Look at each scheduled workflow's latest scheduled run
        id: check
        run: |
          set -euo pipefail
          # workflow file, and the most hours a healthy schedule leaves between runs.
          watched='nightly.yml 30
          bump-pins.yml 194
          release-merge.yml 194
          terraform-state-backup.yml 194'
          # Hours since an ISO 8601 time; the workflows API gives an offset such as +09:00.
          # shellcheck disable=SC2016
          age='def age: sub("\\.[0-9]+"; "") | capture("^(?<t>.{19})(?<z>.*)$")
            | (.t + "Z" | fromdateiso8601) as $t
            | (if .z == "Z" then 0 else (.z[1:3] | tonumber) * 3600 + (.z[4:6] | tonumber) * 60 end) as $off
            | ((now - $t + (if .z[0:1] == "-" then -$off else $off end)) / 3600 | floor);'
          : > "$RUNNER_TEMP/problems"
          while read -r file hours; do
            api="repos/$GITHUB_REPOSITORY/actions/workflows/$file"
            IFS=$'\t' read -r state added <<< "$(gh api "$api" --jq "$age"' [.state, (.created_at | age)] | @tsv')"
            if [ "$state" != active ]; then
              echo "- \`$file\` is $state." >> "$RUNNER_TEMP/problems"
              continue
            fi
            run=$(gh api "$api/runs?event=schedule&per_page=1" --jq "$age"' .workflow_runs[0] // empty
              | [.created_at, (.created_at | age), (.conclusion // "running"), .html_url] | @tsv')
            if [ -z "$run" ]; then
              # A workflow newer than one interval has not had its first run yet.
              if [ "$added" -gt "$hours" ]; then
                echo "- \`$file\` has never run on schedule." >> "$RUNNER_TEMP/problems"
              fi
              continue
            fi
            IFS=$'\t' read -r created since conclusion url <<< "$run"
            if [ "$conclusion" = startup_failure ]; then
              echo "- \`$file\` failed to start: $url" >> "$RUNNER_TEMP/problems"
            elif [ "$since" -gt "$hours" ]; then
              echo "- \`$file\` has not run on schedule since $created: $url" >> "$RUNNER_TEMP/problems"
            fi
          done <<< "$watched"
          cat "$RUNNER_TEMP/problems" >> "$GITHUB_STEP_SUMMARY"
          numbers=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title,author \
            --jq '[.[] | select(.author.login == "app/github-actions" and .title == env.TITLE)] | map(.number) | sort | join(" ")')
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"

      # One Issue per streak; a later day comments only the problems not yet in it.
      - name: Open, comment on or close the Issue
        env:
          NUMBERS: ${{ steps.check.outputs.numbers }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          problems="$RUNNER_TEMP/problems"
          if [ ! -s "$problems" ]; then
            for number in $NUMBERS; do
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed \
                --comment "Every scheduled workflow ran again: $RUN_URL"
            done
            exit 0
          fi
          if [ -z "$NUMBERS" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body "$(printf 'Found by %s:\n\n%s\n' "$RUN_URL" "$(cat "$problems")")"
            exit 0
          fi
          for number in $NUMBERS; do
            gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json body,comments \
              --jq '.body, .comments[].body' > "$RUNNER_TEMP/seen"
            new=$(grep -vxF -f "$RUNNER_TEMP/seen" "$problems" || true)
            if [ -n "$new" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
                --body "$(printf 'Found by %s:\n\n%s\n' "$RUN_URL" "$new")"
            fi
          done
