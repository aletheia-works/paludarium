name: Terraform Plan

on:
  pull_request_target:
    paths:
      - 'infra/github/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  plan:
    # pull_request_target hands the plan every secret while it runs the
    # PR's own configuration, so a fork PR runs it only when its author
    # belongs to the repository.
    if: >-
      github.repository_owner == 'aletheia-works' &&
      (github.event.pull_request.head.repo.full_name == github.repository ||
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    uses: aletheia-works/.github/.github/workflows/terraform-plan.yml@0ab4b956b12760b3926ac8f768e04432404a5182 # v1.3.4
    with:
      working_directory: infra/github
    secrets: inherit
