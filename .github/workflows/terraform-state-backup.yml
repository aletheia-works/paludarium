name: Terraform State Backup

on:
  schedule:
    - cron: '0 3 * * 1'

  workflow_run:
    workflows: ["Terraform Apply"]
    types:
      - completed

  workflow_dispatch:

# The backup renews the encrypted state artifact; nothing is published as a
# Release.
permissions:
  contents: read
  actions: write

jobs:
  backup:
    if: |
      github.repository_owner == 'aletheia-works' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success')
    uses: aletheia-works/.github/.github/workflows/terraform-state-backup.yml@f5bb52fe38d6ddf151662ed6b64c0b23eeb50ec4 # v1.3.3
    with:
      working_directory: infra/github
    secrets:
      TF_TOKEN_GITHUB: ${{ secrets.TF_TOKEN_GITHUB }}
