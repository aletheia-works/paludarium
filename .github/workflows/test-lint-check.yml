name: Test polyglot lint

# `mise run lint:all` on every pull request, as in the other aletheia-works
# repositories: rustfmt and clippy, ShellCheck, actionlint, Ruff, Tombi and rumdl,
# plus the checks of the documented system-call list and interfaces and of the
# x87 table.
# ci.yml calls it, so ci-ok includes it. Actions are pinned by commit SHA and the
# default token is read-only.
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-lint-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Polyglot lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        # Retried: static.rust-lang.org downloads sometimes fail on CI. mise then
        # finds the toolchain of rust-toolchain.toml already installed.
        uses: ./.github/actions/rust-toolchain
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install: true
          cache: false
      - name: Run polyglot lint
        run: mise run lint:all
        env:
          # ci.yml's stable-clippy job runs rust:check's clippy of the stable
          # Rust of rust-version.
          PALUDARIUM_SKIP_STABLE_CLIPPY: '1'
