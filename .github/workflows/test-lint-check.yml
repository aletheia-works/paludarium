name: Test polyglot lint

# `mise run lint:all` on every pull request, as in the other aletheia-works
# repositories: rustfmt and clippy, ShellCheck, actionlint, Ruff, Tombi and rumdl,
# plus the checks of the documented system-call list and interfaces.
# ci.yml calls it, so ci-ok includes it. Actions are pinned by commit SHA and the
# default token is read-only.
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-lint-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Polyglot lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        # Retried: static.rust-lang.org downloads sometimes fail on CI. mise then
        # finds the toolchain of rust-toolchain.toml already installed.
        uses: ./.github/actions/rust-toolchain
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          cache: false
      - name: Run polyglot lint
        run: mise run lint:all
