name: Tofu fmt autofix

on:
  pull_request_target:
    paths:
      - 'infra/github/**'
      - '.github/workflows/tofu-fmt-autofix.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  autofix:
    if: github.repository_owner == 'aletheia-works'
    uses: aletheia-works/.github/.github/workflows/terraform-autofix.yml@2d85c4ddca01b35127a16915f0000bc54fdc85a6 # v1.4.0
    with:
      working_directory: infra/github
      commit_message: 'style(infra): tofu fmt -recursive'
    secrets: inherit
