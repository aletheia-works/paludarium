name: Tofu fmt autofix

on:
  pull_request_target:
    paths:
      - 'infra/github/**'
      - '.github/workflows/tofu-fmt-autofix.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  autofix:
    if: github.repository_owner == 'aletheia-works'
    uses: aletheia-works/.github/.github/workflows/terraform-autofix.yml@0ab4b956b12760b3926ac8f768e04432404a5182 # v1.3.4
    with:
      working_directory: infra/github
      commit_message: 'style(infra): tofu fmt -recursive'
    secrets: inherit
