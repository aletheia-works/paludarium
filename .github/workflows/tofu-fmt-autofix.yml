name: Tofu fmt autofix

on:
  pull_request_target:
    paths:
      - 'infra/github/**'
      - '.github/workflows/tofu-fmt-autofix.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  autofix:
    if: github.repository_owner == 'aletheia-works'
    uses: aletheia-works/.github/.github/workflows/terraform-autofix.yml@f5bb52fe38d6ddf151662ed6b64c0b23eeb50ec4 # v1.3.3
    with:
      working_directory: infra/github
      commit_message: 'style(infra): tofu fmt -recursive'
    secrets: inherit
