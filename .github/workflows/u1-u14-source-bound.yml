# Pull-request gate (team.md Testing Posture, Q7): unit tests on Linux,
# macOS and Windows, fmt, clippy (-D warnings), dependency checks, the
# x86-64 Linux differential tests and the 80% line-coverage floor.
# Every job must pass before merging. Actions are pinned by commit SHA and
# the default token is read-only (NFR8.2).
name: U1 U14 current-source evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: u1-u14-source-bound-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PALUDARIUM_TEST_NODE: node
  # The U1 crates (unit-test-instructions.md).
  U1_PACKAGES: >-
    -p paludarium-types -p paludarium-decoder -p paludarium-mmu
    -p paludarium-cpu -p paludarium-loader -p paludarium-vfs
    -p paludarium-kernel -p paludarium-host -p paludarium-jit
    -p paludarium-runtime -p paludarium

defaults:
  run:
    shell: bash

jobs:
  test:
    name: unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Use a job-local rustup home
        # GitHub-hosted runners sometimes ship a partially installed toolchain in
        # ~/.rustup, which makes rustup fail with "detected conflict".
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-home" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.12.0'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: false
        with:
          persist-credentials: false
      # Restore before anything is written to target/: on a partial cache
      # match rust-cache cleans target/ first.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Record signed source and actual compiler
        run: |
          mkdir -p target/u1-source-bound
          rustc -Vv > target/u1-source-bound/compiler.txt
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          rows = []
          for name in sorted(p for p in paths if p):
              p = pathlib.Path(name)
              if p.is_file():
                  data = p.read_bytes()
                  signed = subprocess.check_output(['git', 'cat-file', 'blob', 'HEAD:' + name])
                  if data != signed:
                      raise RuntimeError('checkout differs from signed input: ' + name)
                  rows.append({'path': name, 'sha256': hashlib.sha256(data).hexdigest()})
          receipt = {'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'rows': rows}
          pathlib.Path('target/u1-source-bound/inputs.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Preserve source receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u1-source-bound-inputs-${{ github.job }}-${{ runner.os }}
          path: target/u1-source-bound/
          retention-days: 14
      # rustup installs the toolchain pinned in rust-toolchain.toml (NFR9.1).
      - run: rustup show active-toolchain
      - name: Unit tests (U1 crates)
        shell: bash
        run: |
          read -r -a packages <<< "$U1_PACKAGES"
          cargo test --locked "${packages[@]}" -- --nocapture
        env:
          RUST_BACKTRACE: "1"
      - name: Harness unit tests
        run: cargo test --locked -p paludarium-harness --lib

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Use a job-local rustup home
        # GitHub-hosted runners sometimes ship a partially installed toolchain in
        # ~/.rustup, which makes rustup fail with "detected conflict".
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: false
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Record signed source and actual compiler
        run: |
          mkdir -p target/u1-source-bound
          rustc -Vv > target/u1-source-bound/compiler.txt
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          rows = []
          for name in sorted(p for p in paths if p):
              p = pathlib.Path(name)
              if p.is_file():
                  data = p.read_bytes()
                  signed = subprocess.check_output(['git', 'cat-file', 'blob', 'HEAD:' + name])
                  if data != signed:
                      raise RuntimeError('checkout differs from signed input: ' + name)
                  rows.append({'path': name, 'sha256': hashlib.sha256(data).hexdigest()})
          receipt = {'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'rows': rows}
          pathlib.Path('target/u1-source-bound/inputs.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Preserve source receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u1-source-bound-inputs-${{ github.job }}-${{ runner.os }}
          path: target/u1-source-bound/
          retention-days: 14
      - name: rustfmt
        run: |
          cargo fmt --all --check
          cargo fmt --check --manifest-path fuzz/Cargo.toml
          cargo fmt --check --manifest-path tests/guests/hello-rs/Cargo.toml
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: decoder builds for wasm32
        run: cargo build --locked -p paludarium-decoder -p paludarium-mmu -p paludarium-cpu --target wasm32-unknown-unknown

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Use a job-local rustup home
        # GitHub-hosted runners sometimes ship a partially installed toolchain in
        # ~/.rustup, which makes rustup fail with "detected conflict".
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: false
        with:
          persist-credentials: false
      - name: Record signed source and actual compiler
        run: |
          mkdir -p target/u1-source-bound
          rustc -Vv > target/u1-source-bound/compiler.txt
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          rows = []
          for name in sorted(p for p in paths if p):
              p = pathlib.Path(name)
              if p.is_file():
                  data = p.read_bytes()
                  signed = subprocess.check_output(['git', 'cat-file', 'blob', 'HEAD:' + name])
                  if data != signed:
                      raise RuntimeError('checkout differs from signed input: ' + name)
                  rows.append({'path': name, 'sha256': hashlib.sha256(data).hexdigest()})
          receipt = {'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'rows': rows}
          pathlib.Path('target/u1-source-bound/inputs.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Preserve source receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u1-source-bound-inputs-${{ github.job }}-${{ runner.os }}
          path: target/u1-source-bound/
          retention-days: 14
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: cargo-deny
          cache: false
      # Licenses compatible with Apache-2.0, crates.io only, RustSec,
      # forbidden crates (NFR8.1, NFR8.4).
      - run: cargo deny --locked check

  differential:
    name: differential tests (x86-64 Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Use a job-local rustup home
        # GitHub-hosted runners sometimes ship a partially installed toolchain in
        # ~/.rustup, which makes rustup fail with "detected conflict".
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: false
        with:
          persist-credentials: false
      # Restore before anything is written to target/: on a partial cache
      # match rust-cache cleans target/ first.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Record signed source and actual compiler
        run: |
          mkdir -p target/u1-source-bound
          rustc -Vv > target/u1-source-bound/compiler.txt
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          rows = []
          for name in sorted(p for p in paths if p):
              p = pathlib.Path(name)
              if p.is_file():
                  data = p.read_bytes()
                  signed = subprocess.check_output(['git', 'cat-file', 'blob', 'HEAD:' + name])
                  if data != signed:
                      raise RuntimeError('checkout differs from signed input: ' + name)
                  rows.append({'path': name, 'sha256': hashlib.sha256(data).hexdigest()})
          receipt = {'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'rows': rows}
          pathlib.Path('target/u1-source-bound/inputs.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Preserve source receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u1-source-bound-inputs-${{ github.job }}-${{ runner.os }}
          path: target/u1-source-bound/
          retention-days: 14
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Record native architectural profile
        run: |
          mkdir -p target/u3-guests
          uname -a > target/u3-guests/uname.txt
          lscpu > target/u3-guests/cpu.txt
      # Builds the guests from source (BR7.2), runs each natively and under
      # the emulator, compares stdout/stderr/exit status (BR7.1) and prints
      # the run times (NFR6.1).
      - run: cargo test --locked -p paludarium-harness --test diff_u1 --test diff_u2 --test parallel_u2 --test diff_u4 --test diff_u9 --test diff_u3 --test diff_u8 -- --nocapture
      - name: Capture actual hello exit states
        shell: bash
        run: |
          cargo build --locked -p paludarium
          python3 - <<'PY'
          import hashlib, json, os, signal, subprocess, time
          from pathlib import Path
          root=Path.cwd()
          out=root/'target/u1-hello-receipts'
          out.mkdir(parents=True, exist_ok=True)
          cli=root/'target/debug/paludarium'
          guests=root/'target/guests'
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          rows=[]
          for name,binary,args in [('hello-c','hello-c',[]),('hello-rs','hello-rs',[]),('hello-rs-args','hello-rs',['--flag','two words'])]:
              guest=guests/binary
              pair=[]
              for mode in ('native','emulated'):
                  command=[binary,*args] if mode=='native' else [str(cli),binary,*args]
                  start=time.monotonic()
                  process=subprocess.Popen(command, executable=str(guest) if mode=='native' else None,
                      cwd=guests, env={}, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE, start_new_session=True)
                  timed_out=False
                  try:
                      stdout,stderr=process.communicate(timeout=30)
                  except subprocess.TimeoutExpired:
                      timed_out=True
                      os.killpg(process.pid,signal.SIGKILL)
                      stdout,stderr=process.communicate()
                  elapsed=time.monotonic()-start
                  prefix=name+'-'+mode
                  (out/(prefix+'.stdout')).write_bytes(stdout)
                  (out/(prefix+'.stderr')).write_bytes(stderr)
                  row={'name':name,'mode':mode,'arguments':args,'argv0':binary,
                      'returncode':process.returncode,'signal':-process.returncode if process.returncode<0 else None,
                      'timed_out':timed_out,'seconds':elapsed,'guest_sha256':sha(guest),
                      'cli_sha256':sha(cli),'stdout_sha256':hashlib.sha256(stdout).hexdigest(),
                      'stderr_sha256':hashlib.sha256(stderr).hexdigest()}
                  rows.append(row)
                  pair.append((stdout,stderr))
              assert pair[0]==pair[1], name+' output mismatch'
          receipt={'schemaVersion':1,'head':os.environ['GITHUB_SHA'],
              'compiler':subprocess.check_output(['rustc','--version','--verbose']).decode(),'rows':rows}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          (out/'paludarium').write_bytes(cli.read_bytes())
          for name in ('hello-c','hello-rs'):
              (out/name).write_bytes((guests/name).read_bytes())
          assert len(rows)==6 and all(r['returncode']==0 and r['signal'] is None and not r['timed_out'] and 0<=r['seconds']<=30 for r in rows)
          PY
      - name: Verify repaired frame and caller-stack boundaries
        run: python3 -B scripts/u1-frame-regression.py --guests target/guests --emulator target/debug/paludarium --output target/u1-frame-regression --runs 100
      - name: Retain frame regression originals
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u1-frame-regression
          path: target/u1-frame-regression/
          if-no-files-found: error
          retention-days: 14
      - name: Retain actual hello results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u1-hello-exit-receipts
          path: target/u1-hello-receipts/
          if-no-files-found: error
          retention-days: 7
      - name: Retain fresh U3 architectural observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u3-differential-observations
          path: target/u3-guests/
          retention-days: 7

  coverage:
    name: line coverage >= 80%
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PALUDARIUM_U3_FULL_REPLAY: '1'
      PALUDARIUM_U3_NATIVE_OBSERVATIONS: ${{ github.workspace }}/target/u3-guests/observe.native
      PALUDARIUM_U3_NATIVE_FAULTS: ${{ github.workspace }}/target/u3-guests/fault-observe.native
      PALUDARIUM_U3_NATIVE_CPUID: ${{ github.workspace }}/target/u3-guests/cpuid-observe.native
      PALUDARIUM_U5_EMULATOR: ${{ github.workspace }}/target/llvm-cov-target/debug/paludarium
      PALUDARIUM_U6_EMULATOR: ${{ github.workspace }}/target/llvm-cov-target/debug/paludarium
    steps:
      - name: Use a job-local rustup home
        # GitHub-hosted runners sometimes ship a partially installed toolchain in
        # ~/.rustup, which makes rustup fail with "detected conflict".
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-home" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.12.0'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: false
        with:
          persist-credentials: false
      # Restore before anything is written to target/: on a partial cache
      # match rust-cache cleans target/ first.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Record signed source and actual compiler
        run: |
          mkdir -p target/u1-source-bound
          rustc -Vv > target/u1-source-bound/compiler.txt
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          rows = []
          for name in sorted(p for p in paths if p):
              p = pathlib.Path(name)
              if p.is_file():
                  data = p.read_bytes()
                  signed = subprocess.check_output(['git', 'cat-file', 'blob', 'HEAD:' + name])
                  if data != signed:
                      raise RuntimeError('checkout differs from signed input: ' + name)
                  rows.append({'path': name, 'sha256': hashlib.sha256(data).hexdigest()})
          receipt = {'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'rows': rows}
          pathlib.Path('target/u1-source-bound/inputs.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Preserve source receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u1-source-bound-inputs-${{ github.job }}-${{ runner.os }}
          path: target/u1-source-bound/
          retention-days: 14
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Record native architectural profile
        run: |
          mkdir -p target/u3-guests
          uname -a > target/u3-guests/uname.txt
          lscpu > target/u3-guests/cpu.txt
      - name: Generate fresh U3 native inputs before instrumented library tests
        shell: bash
        run: |
          bash tests/guests/u3/build.sh target/u3-guests
          python3 - <<'PY_NATIVE'
          from pathlib import Path
          import subprocess, os, signal, json, hashlib
          out=Path('target/u3-guests')
          rows=[]
          for name, expected_rows in [('observe',23576),('fault-observe',1162),('cpuid-observe',12)]:
              binary=out/name
              with (out/(name+'.native')).open('wb') as stdout, (out/(name+'.stderr')).open('wb') as stderr:
                  child=subprocess.Popen([str(binary.resolve())], stdout=stdout, stderr=stderr, start_new_session=True)
                  try:
                      code=child.wait(timeout=30)
                  except subprocess.TimeoutExpired:
                      os.killpg(child.pid,signal.SIGKILL)
                      child.wait()
                      raise
              data=(out/(name+'.native')).read_bytes()
              rows.append({'name':name,'exit':code,'rows':len(data.splitlines()),'binary_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),'output_sha256':hashlib.sha256(data).hexdigest()})
              (out/'native-input-receipt.json').write_text(json.dumps(rows,indent=2)+'\n')
              assert code==0 and len(data.splitlines())==expected_rows and not (out/(name+'.stderr')).read_bytes()
          PY_NATIVE
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: aqua:taiki-e/cargo-llvm-cov
          cache: false
      # NFR3.3: fails below 80% of lines. The floor is never lowered.
      - name: Workspace line coverage >= 80%
        run: |
          cargo llvm-cov clean --workspace
          (
            # shellcheck disable=SC1090
            source <(cargo llvm-cov show-env --sh)
            cargo build --locked -p paludarium --target-dir target/llvm-cov-target
          )
          cargo llvm-cov --no-clean --locked --workspace --fail-under-lines 80 --json --output-path target/u1-workspace-coverage.json
        env:
          # Instrumented independent cases run serially; race cases still
          # launch their own host workers and retain the 30-second watchdog.
          RUST_TEST_THREADS: "1"
      - name: U1 package line coverage >= 80%
        # Keep the same U1 production file set; fresh architectural tests live
        # in Harness and must execute when measuring the newly shared CPU code.
        run: |
          cargo llvm-cov clean --workspace
          (
            # shellcheck disable=SC1090
            source <(cargo llvm-cov show-env --sh)
            cargo build --locked -p paludarium --target-dir target/llvm-cov-target
          )
          read -r -a packages <<< "$U1_PACKAGES"
          cargo llvm-cov --no-clean --locked "${packages[@]}" -p paludarium-harness --ignore-filename-regex 'paludarium-harness/' --fail-under-lines 80 --json --output-path target/u1-package-coverage.json
        env:
          RUST_TEST_THREADS: "1"

      - name: Retain fixed U1 coverage and fresh native inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u1-source-bound-coverage
          path: |
            target/u1-package-coverage.json
            target/u1-workspace-coverage.json
            target/u3-guests/
            target/guests/
          retention-days: 14
