name: U13 fresh Linux oracle before Windows Host changes
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-first:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.0'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools cmake perl make pkg-config
      - run: rustup toolchain install nightly-2026-10-11 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview --target x86_64-unknown-linux-musl
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: cargo-deny
          cache: false
      - name: Actual compiler and runner readiness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/u13-native-first
          rustc -Vv > target/u13-native-first/compiler.txt
          cargo -V > target/u13-native-first/cargo.txt
          python --version > target/u13-native-first/python.txt
          cargo deny --version > target/u13-native-first/deny.txt
          sha256sum Cargo.lock fuzz/Cargo.lock rust-toolchain.toml tests/guests/u10/source-lock.json > target/u13-native-first/inputs-before.sha256
          python scripts/u13-run.py --self-test
          cargo test --locked -p paludarium-host --test u9_public_api
          python -m unittest discover -s tests/guests/u13/runner-tests -p 'test_*.py'
      - name: Fixed unmodified guests with license audits
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python tests/guests/u10/build.py target/guests/u10 --advisory-policy u15-fixed-aube-zip9-name 2>&1 | tee target/u13-native-first/build.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > target/u13-native-first/build-exit.txt
          test "$status" = 0
      - name: Fresh isolated Linux fourteen cases
        shell: bash
        run: |
          set -euo pipefail
          set +e
          sudo unshare --net "$(command -v python)" scripts/u13-run.py --native-only --guests target/guests/u10 --output target/u13/native 2>&1 | tee target/u13-native-first/native.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > target/u13-native-first/native-exit.txt
          test "$status" = 0
          python -c 'import json; r=json.load(open("target/u13/native/observations.json")); assert r["native_complete"] and len(r["rows"])==14; assert all(x["exit"]==0 and not x["timed_out"] and 0<=x["wall_seconds"]<=30 for x in r["rows"].values())'
          sudo unshare --net "$(command -v python)" scripts/u13-run.py --native-only --original-argv --guests target/guests/u10 --output target/u13/native-original 2>&1 | tee target/u13-native-first/native-original.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > target/u13-native-first/native-original-exit.txt
          test "$status" = 0
      - name: Unchanged lock inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum Cargo.lock fuzz/Cargo.lock rust-toolchain.toml tests/guests/u10/source-lock.json > target/u13-native-first/inputs-after.sha256
          cmp target/u13-native-first/inputs-before.sha256 target/u13-native-first/inputs-after.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: u13-native-first
          path: |
            target/u13-native-first/
            target/u13/native/
            target/u13/native-original/
            target/guests/u10/build-receipt.json
            target/guests/u10/*-build.log
            target/guests/u10/*-dependencies.log
            target/guests/u10/aube-deny.toml
            target/guests/u10/licenses/
            target/guests/u10/probe
            target/guests/u10/aube
          retention-days: 14
