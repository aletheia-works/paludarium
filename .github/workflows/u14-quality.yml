# Pull-request gate (team.md Testing Posture, Q7): unit tests on Linux,
# macOS and Windows, fmt, clippy (-D warnings), dependency checks, the
# x86-64 Linux differential tests and the 80% line-coverage floor.
# Every job must pass before merging. Actions are pinned by commit SHA and
# the default token is read-only (NFR8.2).
name: U14 current full quality

on:
  # Called by nightly.yml (ci-config.md); dispatched by hand before a release.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: u14-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PALUDARIUM_TEST_NODE: node
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_TERM_COLOR: always
  # The U1 crates (unit-test-instructions.md).
  U1_PACKAGES: >-
    -p paludarium-types -p paludarium-decoder -p paludarium-mmu
    -p paludarium-cpu -p paludarium-loader -p paludarium-vfs
    -p paludarium-kernel -p paludarium-host -p paludarium-jit
    -p paludarium-runtime -p paludarium

defaults:
  run:
    shell: bash

jobs:
  u13-oracle:
    uses: ./.github/workflows/u14-native-first.yml
  windows-host:
    needs: u13-oracle
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: false
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.12.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15'
      - name: Preserve checkout bytes and read-only signed blobs
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('target/u13/windows-byte-audit')
          names = ['deny.toml', 'Cargo.lock', 'fuzz/Cargo.lock', 'rust-toolchain.toml', 'tests/guests/u10/fixtures/outside/linked/package.json', 'tests/guests/u10/fixtures/app/package.json', 'tests/guests/u10/fixtures/app/filedep/package.json']
          rows = []
          for name in names:
              actual = pathlib.Path(name).read_bytes()
              signed = subprocess.check_output(['git', 'cat-file', 'blob', 'HEAD:' + name])
              row = {'path': name}
              for origin, data in [('checkout', actual), ('signed', signed)]:
                  dest = root / origin / name
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(data)
                  row[origin] = {'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data), 'lf': data.count(b'\n'), 'crlf': data.count(b'\r\n')}
              rows.append(row)
          config = subprocess.run(['git', 'config', '--show-origin', '--get', 'core.autocrlf'], capture_output=True, text=True, check=False)
          report = {'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'autocrlf': {'code': config.returncode, 'stdout': config.stdout, 'stderr': config.stderr}, 'files': rows}
          (root / 'audit.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          if any(row['checkout'] != row['signed'] for row in rows):
              raise RuntimeError('Windows checkout differs from signed source bytes')
          PYCODE
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: u13-native-first
          path: target
      - run: python3 -m pip install 'coverage==7.16.2'
      - name: Python comparison boundary regressions and defined coverage scope
        run: python3 -m coverage run --data-file=target/u13-python.coverage --include='tests/guests/u13/settings.py,tests/guests/u13/oracle.py,tests/guests/u13/host_comparison.py,tests/guests/u13/fixture.py,tests/guests/u13/operation.py,tests/guests/u13/runner.py,tests/guests/u13/windows_job.py' -m unittest discover -s tests/guests/u13/runner-tests -p 'test_*.py'
      - run: rustup toolchain install nightly-2026-10-11 --profile minimal --component llvm-tools-preview
      - name: Compile and lint the Windows configuration, including actual FFI and tests
        run: cargo clippy --locked -p paludarium-host -p paludarium-harness --all-targets -- -D warnings
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: aqua:taiki-e/cargo-llvm-cov
          cache: false
      - name: Record actual inputs and run native Host boundaries
        run: |
          mkdir -p target/u13/windows
          rustc -Vv > target/u13/windows/compiler.txt
          python3 - <<'PY' > target/u13/windows/inputs-before.sha256
          import hashlib, pathlib
          for name in ('Cargo.lock', 'fuzz/Cargo.lock', 'rust-toolchain.toml'):
              print(hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() + '  ' + name)
          PY
          cargo llvm-cov clean --workspace
          cargo llvm-cov test --no-report --locked -p paludarium-host --lib -- --test-threads=1
      - name: Required thirty-two real guest comparisons without Rust instrumentation
        env:
          CARGO_TARGET_DIR: target/u13-uninstrumented
        run: |
          set -euo pipefail
          mkdir -p target/u13/windows/uninstrumented
          cargo test --locked -p paludarium-harness --test diff_u13 --no-run --message-format=json > target/u13/windows/uninstrumented/build.jsonl
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          rows = [json.loads(line) for line in pathlib.Path('target/u13/windows/uninstrumented/build.jsonl').read_text().splitlines()]
          binaries = [row['executable'] for row in rows if row.get('reason') == 'compiler-artifact' and row.get('target', {}).get('name') == 'diff_u13' and row.get('executable')]
          if len(binaries) != 1:
              raise RuntimeError('expected exactly one uninstrumented U13 harness executable')
          flags = {name: os.environ.get(name) for name in ('RUSTFLAGS', 'CARGO_ENCODED_RUSTFLAGS', 'CARGO_TARGET_DIR', 'RUSTC_WRAPPER', '__CARGO_LLVM_COV_RUSTC_WRAPPER', '__CARGO_LLVM_COV_RUSTC_WRAPPER_RUSTFLAGS', '__CARGO_LLVM_COV_RUSTC_WRAPPER_CRATE_NAMES')}
          if os.environ.get('CARGO_ENCODEDRUSTFLAGS') is not None:
              raise RuntimeError('misspelled encoded Rust flag variable')
          if flags['__CARGO_LLVM_COV_RUSTC_WRAPPER'] is not None or any('instrument-coverage' in (flags[name] or '') for name in ('RUSTFLAGS', 'CARGO_ENCODED_RUSTFLAGS', '__CARGO_LLVM_COV_RUSTC_WRAPPER_RUSTFLAGS')):
              raise RuntimeError('required guest executable is coverage instrumented')
          receipt = {'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'compiler': subprocess.check_output(['rustc', '-Vv'], text=True), 'flags': flags, 'binary_sha256': hashlib.sha256(pathlib.Path(binaries[0]).read_bytes()).hexdigest()}
          pathlib.Path('target/u13/windows/native-build-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          for original, oracle, output in [(False, 'native', 'comparison'), (True, 'native-original', 'comparison-original')]:
              command = ['python3', '-m', 'coverage', 'run', '--append', '--data-file=target/u13-python.coverage', '--include=tests/guests/u13/settings.py,tests/guests/u13/oracle.py,tests/guests/u13/host_comparison.py,tests/guests/u13/fixture.py,tests/guests/u13/operation.py,tests/guests/u13/runner.py,tests/guests/u13/windows_job.py', 'scripts/u13-run.py', '--guests', 'target/guests/u10', '--native-report', f'target/u13/{oracle}/observations.json', '--output', f'target/u13/windows/{output}', '--emulator', binaries[0]]
              if original:
                  command.append('--original-argv')
              subprocess.run(command, check=True)
          PY
      - name: Independent instrumented primary guest coverage, same signed source and guest bytes
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo test --locked -p paludarium-harness --test diff_u13 --no-run --message-format=json > target/u13/windows/build.jsonl
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          rows = [json.loads(line) for line in pathlib.Path('target/u13/windows/build.jsonl').read_text().splitlines()]
          binaries = [row['executable'] for row in rows if row.get('reason') == 'compiler-artifact' and row.get('target', {}).get('name') == 'diff_u13' and row.get('executable')]
          if len(binaries) != 1:
              raise RuntimeError('expected exactly one U13 harness executable')
          flags = {name: os.environ.get(name) for name in ('RUSTFLAGS', 'CARGO_ENCODED_RUSTFLAGS', 'CARGO_TARGET_DIR', 'RUSTC_WRAPPER', '__CARGO_LLVM_COV_RUSTC_WRAPPER', '__CARGO_LLVM_COV_RUSTC_WRAPPER_RUSTFLAGS', '__CARGO_LLVM_COV_RUSTC_WRAPPER_CRATE_NAMES')}
          if os.environ.get('CARGO_ENCODEDRUSTFLAGS') is not None:
              raise RuntimeError('misspelled encoded Rust flag variable')
          if flags['__CARGO_LLVM_COV_RUSTC_WRAPPER'] != '1' or not flags['RUSTC_WRAPPER'] or 'diff_u13' not in (flags['__CARGO_LLVM_COV_RUSTC_WRAPPER_CRATE_NAMES'] or '').split(',') or 'instrument-coverage' not in (flags['__CARGO_LLVM_COV_RUSTC_WRAPPER_RUSTFLAGS'] or ''):
              raise RuntimeError('coverage executable lacks instrumentation')
          receipt = {'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'compiler': subprocess.check_output(['rustc', '-Vv'], text=True), 'flags': flags, 'binary_sha256': hashlib.sha256(pathlib.Path(binaries[0]).read_bytes()).hexdigest()}
          pathlib.Path('target/u13/windows/coverage-build-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          subprocess.run(['python3', '-m', 'coverage', 'run', '--append', '--data-file=target/u13-python.coverage', '--include=tests/guests/u13/settings.py,tests/guests/u13/oracle.py,tests/guests/u13/host_comparison.py,tests/guests/u13/fixture.py,tests/guests/u13/operation.py,tests/guests/u13/runner.py,tests/guests/u13/windows_job.py', 'scripts/u13-run.py', '--guests', 'target/guests/u10', '--native-report', 'target/u13/native/observations.json', '--output', 'target/u13/windows/coverage-comparison', '--emulator', binaries[0]], check=True)
          PY
          python3 -m coverage json --data-file=target/u13-python.coverage -o target/u13/windows/python-coverage.json
          python3 -m coverage report --data-file=target/u13-python.coverage --fail-under=80
      - name: Fixed native Host coverage and separate Windows code floor
        run: |
          cargo llvm-cov report --json --output-path target/u13/windows/coverage.json
          python3 - <<'PY'
          import json, pathlib
          expected = {'lib.rs', 'clock.rs', 'threads.rs', 'native_fs.rs', 'fs.rs', 'windows.rs'}
          data = json.loads(pathlib.Path('target/u13/windows/coverage.json').read_text())
          files = [row for row in data['data'][0]['files'] if '/paludarium-host/src/' in pathlib.Path(row['filename']).as_posix() and pathlib.Path(row['filename']).name in expected]
          if {pathlib.Path(row['filename']).name for row in files} != expected:
              raise RuntimeError('coverage denominator missing a native Host file')
          lines = sum(row['summary']['lines']['count'] for row in files)
          covered = sum(row['summary']['lines']['covered'] for row in files)
          result = {'files': sorted(expected), 'lines': lines, 'covered': covered, 'percent': 100 * covered / lines if lines else 0}
          pathlib.Path('target/u13/windows/coverage-scope.json').write_text(json.dumps(result, indent=2) + '\n')
          if not lines or covered / lines < .8:
              raise RuntimeError('native Host coverage below eighty percent')
          common = [row for row in files if pathlib.Path(row['filename']).name != 'windows.rs']
          common_lines = sum(row['summary']['lines']['count'] for row in common)
          common_covered = sum(row['summary']['lines']['covered'] for row in common)
          if not common_lines or common_covered / common_lines < .8:
              raise RuntimeError('five-file common Host coverage below eighty percent')
          pathlib.Path('target/u13/windows/coverage-common.json').write_text(json.dumps({'files': sorted(expected - {'windows.rs'}), 'lines': common_lines, 'covered': common_covered, 'percent': 100 * common_covered / common_lines}, indent=2) + '\n')
          windows = [row for row in files if pathlib.Path(row['filename']).name == 'windows.rs']
          if len(windows) != 1 or not windows[0]['summary']['lines']['count'] or windows[0]['summary']['lines']['percent'] < 80:
              raise RuntimeError('Windows implementation coverage below eighty percent')
          pathlib.Path('target/u13/windows/coverage-windows.json').write_text(json.dumps(windows[0]['summary']['lines'], indent=2) + '\n')
          PY
          python3 - <<'PY' > target/u13/windows/inputs-after.sha256
          import hashlib, pathlib
          for name in ('Cargo.lock', 'fuzz/Cargo.lock', 'rust-toolchain.toml'):
              print(hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() + '  ' + name)
          PY
          cmp target/u13/windows/inputs-before.sha256 target/u13/windows/inputs-after.sha256
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u13-windows-host
          path: |
            target/u13/windows
            target/u13/windows-byte-audit
          retention-days: 14
  u11-programs:
    if: ${{ !contains(github.event.head_commit.message, '[u14-diagnostic-only]') }}
    uses: ./.github/workflows/u14-wasm-acceptance.yml
  u13-fuzz:
    uses: ./.github/workflows/u14-fuzz.yml
  u10-programs:
    name: U10 fixed guests and fresh native differential
    uses: ./.github/workflows/u14-native-diagnostic.yml

  production-wasm:
    name: production wasm (shared Rust heap, nested Workers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.12.0"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.12.0'
      - run: rustup component add rust-src --toolchain nightly-2026-10-11
      - name: Generate and execute fresh native fixtures
        run: |
          mkdir -p target/production-wasm-evidence
          python3 packages/paludarium-wasm/tests/generate-guests.py --check
          python3 scripts/wasm-native-guests.py > target/production-wasm-evidence/native-results.json
      - name: Build actual production Session module
        run: bash scripts/build-wasm.sh
      - name: Compare production wasm with native results
        run: |
          node --test packages/paludarium-wasm/tests/import-check.mjs
          node packages/paludarium-wasm/tests/node-check.mjs packages/paludarium-wasm/paludarium.wasm target/production-wasm-evidence/native-results.json > target/production-wasm-evidence/node-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: production-wasm-evidence
          path: |
            target/production-wasm-evidence/
            packages/paludarium-wasm/paludarium.wasm
          retention-days: 7
  test:
    name: unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.12.0"
      # rustup installs the toolchain pinned in rust-toolchain.toml (NFR9.1).
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Unit tests (U1 crates)
        shell: bash
        run: |
          read -r -a packages <<< "$U1_PACKAGES"
          cargo test --locked "${packages[@]}" -- --nocapture
        env:
          RUST_BACKTRACE: "1"
      - name: Harness unit tests
        run: cargo test --locked -p paludarium-harness --lib
      - name: Windows symlink exchange ten required diagnostic runs
        if: matrix.os == 'windows-latest'
        timeout-minutes: 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($iteration = 1; $iteration -le 10; $iteration++) {
            Write-Output "U7_WINDOWS_REQUIRED_RUN=$iteration/10 head=$env:GITHUB_SHA"
            $lines = & cargo test --locked -p paludarium-host --lib native_fs::u7_tests::u7_native_windows_symlink_rename_race -- --exact --nocapture 2>&1
            $exitCode = $LASTEXITCODE
            $lines | Write-Output
            if ($exitCode -ne 0) { throw "Windows exchange run $iteration failed: exit $exitCode" }
            $text = $lines -join "`n"
            if ($text -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;' -or $text -notmatch 'U7_WINDOWS_WATCHDOG elapsed_ms=') {
              throw "Windows exchange run $iteration did not execute the required watchdog test"
            }
          }

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.12.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: rustfmt
        run: |
          cargo fmt --all --check
          cargo fmt --check --manifest-path fuzz/Cargo.toml
          cargo fmt --check --manifest-path tests/guests/hello-rs/Cargo.toml
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: decoder builds for wasm32
        run: cargo build --locked -p paludarium-decoder -p paludarium-mmu -p paludarium-cpu --target wasm32-unknown-unknown

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.12.0"
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: cargo-deny
          cache: false
      # Licenses compatible with Apache-2.0, crates.io only, RustSec,
      # forbidden crates (NFR8.1, NFR8.4).
      - run: cargo deny --locked check

  differential:
    name: differential tests (x86-64 Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.12.0"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Record native architectural profile
        run: |
          mkdir -p target/u3-guests
          uname -a > target/u3-guests/uname.txt
          lscpu > target/u3-guests/cpu.txt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Builds the guests from source (BR7.2), runs each natively and under
      # the emulator, compares stdout/stderr/exit status (BR7.1) and prints
      # the run times (NFR6.1).
      - run: cargo test --locked -p paludarium-harness --test diff_u1 --test diff_u2 --test parallel_u2 --test diff_u4 --test diff_u9 --test diff_u3 --test diff_u8 --test diff_u14 -- --nocapture
      - name: Retain fresh U3 architectural observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u3-differential-observations
          path: target/u3-guests/
          retention-days: 7

  coverage:
    name: line coverage >= 80%
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PALUDARIUM_U3_FULL_REPLAY: '1'
      PALUDARIUM_U3_NATIVE_OBSERVATIONS: ${{ github.workspace }}/target/u3-guests/observe.native
      PALUDARIUM_U3_NATIVE_FAULTS: ${{ github.workspace }}/target/u3-guests/fault-observe.native
      PALUDARIUM_U3_NATIVE_CPUID: ${{ github.workspace }}/target/u3-guests/cpuid-observe.native
      PALUDARIUM_U5_EMULATOR: ${{ github.workspace }}/target/llvm-cov-target/debug/paludarium
      PALUDARIUM_U6_EMULATOR: ${{ github.workspace }}/target/llvm-cov-target/debug/paludarium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.12.0"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Record native architectural profile
        run: |
          mkdir -p target/u3-guests
          uname -a > target/u3-guests/uname.txt
          lscpu > target/u3-guests/cpu.txt
      - name: Generate fresh U3 native inputs before instrumented library tests
        shell: bash
        run: |
          bash tests/guests/u3/build.sh target/u3-guests
          python3 - <<'PY_NATIVE'
          from pathlib import Path
          import subprocess, os, signal, json, hashlib
          out=Path('target/u3-guests')
          rows=[]
          for name, expected_rows in [('observe',23576),('fault-observe',1162),('cpuid-observe',12)]:
              binary=out/name
              with (out/(name+'.native')).open('wb') as stdout, (out/(name+'.stderr')).open('wb') as stderr:
                  child=subprocess.Popen([str(binary.resolve())], stdout=stdout, stderr=stderr, start_new_session=True)
                  try:
                      code=child.wait(timeout=30)
                  except subprocess.TimeoutExpired:
                      os.killpg(child.pid,signal.SIGKILL)
                      child.wait()
                      raise
              data=(out/(name+'.native')).read_bytes()
              rows.append({'name':name,'exit':code,'rows':len(data.splitlines()),'binary_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),'output_sha256':hashlib.sha256(data).hexdigest()})
              (out/'native-input-receipt.json').write_text(json.dumps(rows,indent=2)+'\n')
              assert code==0 and len(data.splitlines())==expected_rows and not (out/(name+'.stderr')).read_bytes()
          PY_NATIVE
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: aqua:taiki-e/cargo-llvm-cov
          cache: false
      # NFR3.3: fails below 80% of lines. The floor is never lowered.
      - name: Workspace line coverage >= 80%
        run: |
          cargo llvm-cov clean --workspace
          (
            # shellcheck disable=SC1090
            source <(cargo llvm-cov show-env --sh)
            cargo build --locked -p paludarium --target-dir target/llvm-cov-target
          )
          cargo llvm-cov --no-clean --locked --workspace --fail-under-lines 80
        env:
          # Instrumented independent cases run serially; race cases still
          # launch their own host workers and retain the 30-second watchdog.
          RUST_TEST_THREADS: "1"
      - name: U11 changed Rust components line coverage >= 80%
        run: |
          cargo llvm-cov --locked -p paludarium-host -p paludarium-vfs -p paludarium-kernel -p paludarium-runtime -p paludarium-wasm --lib --ignore-filename-regex 'paludarium-(cpu|decoder|mmu|loader|types|jit)/' --fail-under-lines 80 --lcov --output-path target/u11-coverage.lcov
      - name: Retain U11 coverage observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u11-coverage-lcov
          path: target/u11-coverage.lcov
      - name: U1 package line coverage >= 80%
        # Keep the same U1 production file set; fresh architectural tests live
        # in Harness and must execute when measuring the newly shared CPU code.
        run: |
          cargo llvm-cov clean --workspace
          (
            # shellcheck disable=SC1090
            source <(cargo llvm-cov show-env --sh)
            cargo build --locked -p paludarium --target-dir target/llvm-cov-target
          )
          read -r -a packages <<< "$U1_PACKAGES"
          cargo llvm-cov --no-clean --locked "${packages[@]}" -p paludarium-harness --ignore-filename-regex 'paludarium-harness/' --fail-under-lines 80
        env:
          RUST_TEST_THREADS: "1"

      - name: U9 target crates line coverage >= 80%
        run: |
          cargo llvm-cov --locked -p paludarium-host -p paludarium-kernel -p paludarium-runtime -p paludarium -p paludarium-harness --lib --test diff_u9 --test command --ignore-filename-regex 'paludarium-(cpu|decoder|mmu|loader|types|vfs|jit|harness)/' --fail-under-lines 80 --lcov --output-path target/u9-coverage.lcov
          cargo llvm-cov report --ignore-filename-regex 'paludarium-(cpu|decoder|mmu|loader|types|vfs|jit|harness)/'
        env:
          RUST_TEST_THREADS: "1"
      - name: U3 CPU and Decoder line coverage >= 80%
        run: |
          cargo llvm-cov --locked -p paludarium-cpu -p paludarium-decoder -p paludarium-harness --lib --test diff_u3 --ignore-filename-regex 'paludarium-(types|mmu|host|kernel|loader|vfs|jit|runtime|harness)/' --fail-under-lines 80 --lcov --output-path target/u3-coverage.lcov
          cargo llvm-cov report --ignore-filename-regex 'paludarium-(types|mmu|host|kernel|loader|vfs|jit|runtime|harness)/'
        env:
          RUST_TEST_THREADS: "1"
      - name: Retain U3 coverage observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u3-coverage-lcov
          path: target/u3-coverage.lcov
          retention-days: 7
      - name: Retain native states even when coverage fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u3-coverage-native-observations
          path: target/u3-guests/
          retention-days: 7
      - name: Retain U9 coverage line observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u9-coverage-lcov
          path: target/u9-coverage.lcov
          retention-days: 7

  jit-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PALUDARIUM_TEST_NODE: node
      PALUDARIUM_U3_FULL_REPLAY: '1'
      PALUDARIUM_U3_NATIVE_OBSERVATIONS: ${{ github.workspace }}/target/u3-guests/observe.native
      PALUDARIUM_U3_NATIVE_FAULTS: ${{ github.workspace }}/target/u3-guests/fault-observe.native
      PALUDARIUM_U3_NATIVE_CPUID: ${{ github.workspace }}/target/u3-guests/cpuid-observe.native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.12.0'
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: aqua:taiki-e/cargo-llvm-cov
          cache: false
      - run: cargo llvm-cov --locked -p paludarium-jit --all-features --lib --fail-under-lines 80 --lcov --output-path target/u14-jit.lcov
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Record native architectural profile
        run: |
          mkdir -p target/u3-guests
          uname -a > target/u3-guests/uname.txt
          lscpu > target/u3-guests/cpu.txt
      - name: Generate fresh U3 native inputs before instrumented library tests
        shell: bash
        run: |
          bash tests/guests/u3/build.sh target/u3-guests
          python3 - <<'PY_NATIVE'
          from pathlib import Path
          import subprocess, os, signal, json, hashlib
          out=Path('target/u3-guests')
          rows=[]
          for name, expected_rows in [('observe',23576),('fault-observe',1162),('cpuid-observe',12)]:
              binary=out/name
              with (out/(name+'.native')).open('wb') as stdout, (out/(name+'.stderr')).open('wb') as stderr:
                  child=subprocess.Popen([str(binary.resolve())], stdout=stdout, stderr=stderr, start_new_session=True)
                  try:
                      code=child.wait(timeout=30)
                  except subprocess.TimeoutExpired:
                      os.killpg(child.pid,signal.SIGKILL)
                      child.wait()
                      raise
              data=(out/(name+'.native')).read_bytes()
              rows.append({'name':name,'exit':code,'rows':len(data.splitlines()),'binary_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),'output_sha256':hashlib.sha256(data).hexdigest()})
              (out/'native-input-receipt.json').write_text(json.dumps(rows,indent=2)+'\n')
              assert code==0 and len(data.splitlines())==expected_rows and not (out/(name+'.stderr')).read_bytes()
          PY_NATIVE
      - name: Diagnostic and selection Rust components, feature enabled fixed population
        run: cargo llvm-cov --locked -p paludarium-cpu -p paludarium-jit -p paludarium-runtime --features u14-cost-profile --lib --fail-under-lines 80 --lcov --output-path target/u14-cost-profile.lcov
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u14-jit-coverage
          path: |
            target/u14-jit.lcov
            target/u14-cost-profile.lcov

  u14-python-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.12.0'
      - run: python3 -m pip install 'coverage==7.16.2'
      - run: npm install --global npm@12.2.0
      - run: rustup toolchain install nightly-2026-10-11 --profile minimal --component rust-src
      - name: Fresh same-source control for strict Python/JS regressions
        run: python3 -B scripts/build-u14-cost-profile.py --kind acceptance-control --baseline-head "${{ github.sha }}"
      - name: Dedicated prepared-control distribution integration
        env:
          PALUDARIUM_U14_CONTROL_WASM: target/u14-cost-profile/acceptance-control.wasm
        run: node --test packages/paludarium-wasm/tests/u14-control-distribution.test.mjs
      - name: Fixed U14 Python coverage and fail-closed boundaries
        run: |
          mkdir -p target/u14
          python3 -B -m coverage run --data-file=target/u14/python.coverage --include='*/scripts/u14-run.py,*/scripts/build-u14-cost-profile.py,*/tests/guests/u14/guest_policy.py,*/tests/guests/u14/lock_overlay.py,*/tests/guests/u10/build.py,*/tests/guests/u10/evidence.py' -m unittest discover -s tests/guests/u14/runner-tests -p 'test_*.py'
          python3 -B -m coverage report --data-file=target/u14/python.coverage --fail-under=80
          python3 -B -m coverage json --data-file=target/u14/python.coverage -o target/u14/python-coverage.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: u14-python-coverage
          path: target/u14/
