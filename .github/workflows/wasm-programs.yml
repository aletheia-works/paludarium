name: Wasm guest programs
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.0'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools cmake perl make pkg-config
      - uses: ./.github/actions/rust-toolchain
        with:
          args: toolchain install nightly-2026-10-11 --profile minimal --component rust-src
      - shell: bash
        run: bash scripts/rustup-retry.sh target add x86_64-unknown-linux-musl wasm32-unknown-unknown --toolchain nightly-2026-10-11
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: cargo-deny
          cache: false
      - name: Runner tests
        run: python3 -m unittest discover -s tests/guests/wasm/runner-tests -p 'test_*.py'
      - name: Build fixed guests and audit dependencies
        run: python tests/guests/programs/build.py target/guests/u10
      - name: Fresh Linux oracle with filesystem metadata
        run: sudo unshare --net python3 scripts/wasm-run.py --native-only --guest-dir target/guests/u10 --output target/wasm/native
      - name: Build one production wasm module for every environment
        run: bash mise-tasks/wasm/build.sh
      - name: Preserve inputs and fresh oracle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wasm-acceptance-inputs
          path: |
            target/guests/u10/probe
            target/guests/u10/aube
            target/guests/u10/build-receipt.json
            target/guests/u10/*-build.log
            target/guests/u10/*-dependencies.log
            target/guests/u10/aube-deny.toml
            target/guests/u10/licenses/
            target/wasm/native/
            packages/paludarium-wasm/paludarium.wasm
          retention-days: 7
  differential:
    needs: build-oracle
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            environment: node
          - os: ubuntu-latest
            environment: chromium
          - os: ubuntu-latest
            environment: firefox
          - os: macos-latest
            environment: safari
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.11.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: wasm-acceptance-inputs
          path: .
      - name: Install pinned browser driver
        if: matrix.environment == 'chromium' || matrix.environment == 'firefox'
        run: |
          npm ci --prefix spikes/wasm-threads
          node spikes/wasm-threads/node_modules/playwright/cli.js install --with-deps ${{ matrix.environment }}
      - name: Enable actual Safari on CI runner
        if: matrix.environment == 'safari'
        run: sudo safaridriver --enable
      - name: Warm up actual Safari once (never fails the job)
        if: matrix.environment == 'safari'
        timeout-minutes: 3
        continue-on-error: true
        run: |
          set +e
          # A fresh runner launches Safari for the first time here, so safaridriver does not wait for that first launch (NFR7).
          bounded() { perl -e 'alarm shift; exec @ARGV or exit 127' "$@"; }
          bounded 30 open -a Safari; echo "warm-up: open -a Safari exit=$?"
          sleep 10
          echo "warm-up: Safari processes after launch: $(pgrep -x Safari | tr '\n' ' ')"
          bounded 30 osascript -e 'with timeout of 20 seconds' -e 'tell application "Safari" to quit' -e 'end timeout'; echo "warm-up: osascript quit exit=$?"
          sleep 3
          pkill -x Safari; echo "warm-up: pkill -x Safari exit=$? (1 means no Safari process was left)"
          echo "warm-up: Safari processes at the end: $(pgrep -x Safari | tr '\n' ' ')"
          exit 0
      - name: Launcher component and C12 boundary tests
        if: matrix.environment == 'node'
        run: |
          node --test packages/paludarium-wasm/tests/wasm-*.test.mjs
          node packages/paludarium-wasm/tests/wasm-api-check.mjs packages/paludarium-wasm/paludarium.wasm
      - name: Compare fourteen actual guest executions with fresh Linux
        env:
          U11_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'tests/guests/wasm')
          from supervisor import supervise
          environment = os.environ['U11_ENVIRONMENT']
          output = pathlib.Path('target/wasm') / environment
          output.mkdir(parents=True, exist_ok=True)
          if environment == 'node':
              command = ['node', 'packages/paludarium-wasm/tests/wasm-node-check.mjs']
          else:
              command = ['node', 'packages/paludarium-wasm/tests/wasm-browser-check.mjs', environment]
          command += ['packages/paludarium-wasm/paludarium.wasm', 'target/wasm/native/observations.json', 'target/guests/u10', str(output)]
          result = supervise(command, cwd=pathlib.Path.cwd())
          (output / 'suite-supervisor.json').write_text(json.dumps(result, indent=2) + '\n')
          print(result['stdout'])
          print(result['stderr'], file=sys.stderr)
          assert result['exit'] == 0 and not result['timed_out'] and result['process_group_cleaned'], result
          report = json.loads((output / 'observations.json').read_text())
          assert report['complete'] is True and len(report['rows']) == 14
          assert all(row['pass'] and row['exit'] == 0 and not row['timed_out'] for row in report['rows'].values())
          PY
      - name: Preserve raw results and cleanup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wasm-${{ matrix.environment }}
          path: target/wasm/${{ matrix.environment }}/
          retention-days: 7
