[package]
name = "paludarium-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
paludarium-host.workspace = true
paludarium-runtime.workspace = true
paludarium-types.workspace = true
paludarium-vfs.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
paludarium-host.workspace = true
paludarium-jit.workspace = true
paludarium-mmu.workspace = true
paludarium-runtime.workspace = true
paludarium-types.workspace = true
paludarium-vfs.workspace = true

[features]
cost-profile = ["paludarium-jit/cost-profile", "paludarium-runtime/cost-profile"]

[lints]
workspace = true
