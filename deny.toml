# cargo-deny configuration (NFR8.1, NFR8.4).
# Run: cargo deny --locked check

[graph]
all-features = true

[advisories]
version = 2
# Any RustSec advisory (vulnerability, unmaintained, unsound) fails the check.
yanked = "deny"
ignore = []

[licenses]
version = 2
# Only licenses compatible with paludarium's Apache-2.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "Zlib",
  "Unicode-3.0",
]
confidence-threshold = 0.93
# The allow list is a policy, not a census: unused entries are fine.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Blink-derived projects with a known malware history must never be used,
# directly or transitively (project.md Forbidden, NFR8.4).
deny = [
  { name = "webix", reason = "Blink-based webix lineage is forbidden (NFR8.4)" },
  { name = "portabox", reason = "Blink-based portabox lineage is forbidden (NFR8.4)" },
  { name = "lanmower-blink", reason = "lanmower/blink fork is forbidden (NFR8.4)" },
]

[sources]
# Dependencies come from crates.io only (project.md Mandated, NFR8.1).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
