[package]
name = "paludarium-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Fuzz targets (NFR2.2, BR9.1). Run with the pinned nightly:
#   cargo fuzz run <target> -- -max_total_time=600
[package.metadata]
cargo-fuzz = true

# Not part of the main workspace (needs nightly sanitizer flags).
[workspace]
members = ["."]

[[bin]]
bench = false
doc = false
name = "cpu_instructions"
path = "fuzz_targets/cpu_instructions.rs"
test = false

[[bin]]
bench = false
doc = false
name = "jit_compile"
path = "fuzz_targets/jit_compile.rs"
test = false

[[bin]]
bench = false
doc = false
name = "jit_cache"
path = "fuzz_targets/jit_cache.rs"
test = false

[[bin]]
bench = false
doc = false
name = "mmu_instructions"
path = "fuzz_targets/mmu_instructions.rs"
test = false

[[bin]]
bench = false
doc = false
name = "decode"
path = "fuzz_targets/decode.rs"
test = false

[[bin]]
bench = false
doc = false
name = "load_elf"
path = "fuzz_targets/load_elf.rs"
test = false

[[bin]]
bench = false
doc = false
name = "mmu_ops"
path = "fuzz_targets/mmu_ops.rs"
test = false

[[bin]]
bench = false
doc = false
name = "syscall_args"
path = "fuzz_targets/syscall_args.rs"
test = false

[[bin]]
bench = false
doc = false
name = "vfs_paths"
path = "fuzz_targets/vfs_paths.rs"
test = false

[[bin]]
bench = false
doc = false
name = "kernel_threads"
path = "fuzz_targets/kernel_threads.rs"
test = false

[[bin]]
bench = false
doc = false
name = "kernel_futex"
path = "fuzz_targets/kernel_futex.rs"
test = false

[[bin]]
bench = false
doc = false
name = "kernel_events"
path = "fuzz_targets/kernel_events.rs"
test = false

[[bin]]
bench = false
doc = false
name = "kernel_sockets"
path = "fuzz_targets/kernel_sockets.rs"
test = false

[dependencies]
libfuzzer-sys = "0.4"
paludarium-cpu = { path = "../crates/paludarium-cpu" }
paludarium-decoder = { path = "../crates/paludarium-decoder" }
paludarium-host = { path = "../crates/paludarium-host" }
paludarium-jit = { path = "../crates/paludarium-jit", features = ["fuzzing"] }
paludarium-kernel = { path = "../crates/paludarium-kernel" }
paludarium-loader = { path = "../crates/paludarium-loader" }
paludarium-mmu = { path = "../crates/paludarium-mmu" }
paludarium-types = { path = "../crates/paludarium-types" }
paludarium-vfs = { path = "../crates/paludarium-vfs" }
