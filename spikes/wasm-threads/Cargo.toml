[package]
name = "wasm-threads-spike"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# U1 spike (BR8.1, BR8.2): a stand-alone wasm module that two Workers share
# through a shared WebAssembly.Memory. It does not use the Host trait.
# Build: spikes/wasm-threads/build.sh

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
